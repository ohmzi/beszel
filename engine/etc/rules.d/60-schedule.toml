does = "Runs routine_verify_daily. A closing step: it waits for every earlier step of the routine while the window is open and runs once when the window ends with whatever is left."
applies_to = ["routine_verify_daily"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
