[[rule]]
id = "routine.system.stack-backup"
title = "Calendar: nightly 03:30 ai-stack backup"
kind = "schedule"
principle = "one umbrella; capacity planning"
why = "The ai-stack backup (to the SanDisk SSD) is the nightly protection for the Hermes and AI stack config. Showing it keeps heavy cleanup from running on top of it."
does = "Display only. Nominal 03:30 time of the user timer; real time can differ. Runs nothing."
applies_to = ["stack-backup"]
file = "routine.toml"
target = "system[]"
merge = "append"
since = "2026-10-03"
order = 3

[rule.params]
name = "stack-backup"
title = "AI-stack backup"
kind = "backup"
at = "03:30"
managed = "legacy"

[[rule]]
id = "routine.system.plex-butler"
title = "Calendar: Plex butler maintenance until about 05:00"
kind = "schedule"
principle = "one umbrella; capacity planning"
why = "Plex does its own database optimisation and scans in the night; the script's heavy jobs should not fight it. Plex's Media directory is bind-mounted from the SanDisk SSD, so butler work shares that disk with the ai-stack backup (03:30) and the Tunarr sync (Monday 04:15), which are both marked heavy."
does = "Display only. Plex's own scheduled tasks from 02:00 (managed = app: runs inside Plex). Nothing here controls it."
applies_to = ["plex-butler"]
file = "routine.toml"
target = "system[]"
merge = "append"
since = "2026-10-03"
order = 4

[rule.params]
name = "plex-butler"
title = "Plex maintenance (butler, until about 05:00)"
kind = "system"
at = "02:00"
managed = "app"

[[rule]]
id = "routine.system.docker-prune"
title = "Calendar: Sunday 04:00 legacy Docker prune (timer disabled)"
kind = "schedule"
principle = "one umbrella; capacity planning"
why = "The legacy weekly prune is still part of the host's history, and it is shown so the calendar is honest about what could run. Showing a disabled timer in the calendar is deliberate: the calendar must never claim less than the host could do."
does = "Display only. Legacy docker-prune.sh at Sun 04:00 via docker-prune.timer. The owner disabled that timer on 2026-10-02; it is listed so the calendar and the docker_prune_exposure check agree on what the legacy path would do."
applies_to = ["docker-prune"]
file = "routine.toml"
target = "system[]"
merge = "append"
since = "2026-10-03"
order = 5
owner_notes = "docker-prune.timer disabled 2026-10-02 because it would remove the stopped ComfyUI container and its 14.9 GiB image."

[rule.params]
name = "docker-prune"
title = "Docker prune (legacy script)"
kind = "system"
at = "Sun 04:00"
unit = "docker-prune.timer"
managed = "legacy"

[[rule]]
id = "routine.system.prune-openwebui-media"
title = "Calendar: daily 04:00 Open WebUI media prune"
kind = "schedule"
principle = "one umbrella; capacity planning"
why = "Shows the legacy media prune that the openwebui_media_prune task is replacing. Its native replacement runs in the daily routine window (from 07:30) and is report-only for now."
does = "Display only. Legacy prune-openwebui-media.sh at 04:00 daily via its timer; media older than 7 days."
applies_to = ["prune-openwebui-media"]
file = "routine.toml"
target = "system[]"
merge = "append"
since = "2026-10-03"
order = 6

[rule.params]
name = "prune-openwebui-media"
title = "Open WebUI media prune"
kind = "system"
at = "04:00"
unit = "prune-openwebui-media.timer"
managed = "legacy"

[[rule]]
id = "routine.system.fstrim"
title = "Calendar: Monday SSD trim (OS timer)"
kind = "schedule"
principle = "one umbrella; capacity planning"
why = "OS maintenance the script never changes, shown so a trim is not mistaken for a stall. It can be IO-heavy for a while, so it is shown with the other background work."
does = "Display only. fstrim.timer is weekly (Monday from 00:00, then a random delay of up to 100 minutes, so the calendar's Mon 00:47 is nominal). managed = os: observed, never changed."
applies_to = ["fstrim"]
file = "routine.toml"
target = "system[]"
merge = "append"
since = "2026-10-03"
order = 7

[rule.params]
name = "fstrim"
title = "SSD trim"
kind = "system"
at = "Mon 00:47"
unit = "fstrim.timer"
managed = "os"

[[rule]]
id = "routine.system.logrotate"
title = "Calendar: midnight log rotation (OS timer)"
kind = "schedule"
principle = "one umbrella; capacity planning"
why = "The OS rotates logs at midnight; the daily log_compress step works on what it leaves. The daily log compression only sees what rotation leaves behind, so the two must not be confused."
does = "Display only. logrotate.timer at 00:00 (managed = os)."
applies_to = ["logrotate"]
file = "routine.toml"
target = "system[]"
merge = "append"
since = "2026-10-03"
order = 8

[rule.params]
name = "logrotate"
title = "Log rotation"
kind = "system"
at = "00:00"
unit = "logrotate.timer"
managed = "os"

[[rule]]
id = "routine.system.apt-daily-upgrade"
title = "Calendar: 06:00 unattended upgrades (OS timer)"
kind = "schedule"
principle = "one umbrella; capacity planning"
why = "Security updates keep running on their own and finish before the 07:30 daily window. Showing it keeps the daily window from being scheduled on top of an upgrade."
does = "Display only. apt-daily-upgrade.timer at 06:00 plus a random delay of up to 60 minutes (managed = os: observed, never changed)."
applies_to = ["apt-daily-upgrade"]
file = "routine.toml"
target = "system[]"
merge = "append"
since = "2026-10-03"
order = 9

[rule.params]
name = "apt-daily-upgrade"
title = "Unattended upgrades"
kind = "system"
at = "06:00"
unit = "apt-daily-upgrade.timer"
managed = "os"

[[rule]]
id = "routine.system.e2scrub"
title = "Calendar: Sunday filesystem scrub (OS timer)"
kind = "schedule"
principle = "one umbrella; capacity planning"
why = "The ext4 online scrub is a distro job that causes IO; shown so it is accounted for. Heavy IO from the scrub is one more reason heavy cleanup waits for its own window."
does = "Display only. e2scrub_all.timer at Sun 03:10 (managed = os)."
applies_to = ["e2scrub"]
file = "routine.toml"
target = "system[]"
merge = "append"
since = "2026-10-03"
order = 10

[rule.params]
name = "e2scrub"
title = "Filesystem scrub"
kind = "system"
at = "Sun 03:10"
unit = "e2scrub_all.timer"
managed = "os"

[[rule]]
id = "routine.system.diun"
title = "Calendar: 09:00 Diun image update scan"
kind = "schedule"
principle = "one umbrella; capacity planning"
why = "Diun scans registries daily; the weekly image-update review reads its log. The weekly image review reads what Diun found, so its run time is part of the picture."
does = "Display only. Diun's own daily scan at 09:00 (managed = app). routine_image_updates reads the result."
applies_to = ["diun"]
file = "routine.toml"
target = "system[]"
merge = "append"
params = { name = "diun", title = "Diun image update scan", kind = "system", at = "09:00", managed = "app" }
since = "2026-10-03"
order = 11

[[rule]]
id = "routine.settings"
title = "Routine settings: zone, enforcement, attempts, gates, post-check"
kind = "policy"
principle = "classes of service P0-P3; protect before you clean"
why = "The routine only works if its rules are enforced and its limits are bounded: a step that keeps failing must stop, and a heavy step must wait for a quiet host. Enforcement is on by default, so a rule written down here is a rule the guard actually applies."
does = "timezone = America/Toronto (DST-correct windows). enforce = true: the guard really blocks steps outside their window, inside a freeze, behind a busy gate or after a halt (false would only log what it would have blocked). max_attempts = 3: a step that errors three times in one window is given up until the next window. default_gates = [backup, pressure]: a step that needs a quiet window also waits while a backup is running or the spike manager's gate level is 2 or higher (max_pressure_level = 2). post_check_timeout_s = 120 bounds the re-run of the post-check checks."
file = "routine.toml"
target = "settings"
since = "2026-10-03"

[rule.params]
timezone = "America/Toronto"
enforce = true
max_attempts = 3
default_gates = ["backup", "pressure"]
max_pressure_level = 2
post_check_timeout_s = 120

[[rule]]
id = "routine.canary"
title = "Canary: the first apply of each cleaner runs with 10 percent caps"
kind = "safety"
principle = "dry-run first"
why = "The first time a cleaner really changes something is the riskiest. A small first run limits the damage of a wrong assumption."
does = "runs = 1: the first apply run that really changed something is capped to 10 percent (fraction = 0.10) of the items and bytes the task would use. The canary only lowers limits. relax_after = 1: a canary run that applied nothing because every action exceeded the small byte cap is shown as canary-throttled and the next run gets the normal byte cap (still with the small item count), so it cannot starve."
file = "routine.toml"
target = "canary"
params = { runs = 1, fraction = 0.1, relax_after = 1 }
since = "2026-10-03"

[[rule]]
id = "routine.continuous"
title = "Check-tier tasks that restart things wait out a freeze"
kind = "safety"
principle = "throttle before kill; classes of service P0-P3"
why = "Some tasks run every 15 minutes and must be able to act at any hour (the spike ladder), but a restart of a service the family is using is not allowed during peak hours. The rule is enforced per task and per rung, so the protective rungs keep working while only the destructive ones wait."
does = "disruptive = [immich_recycle]: this check-tier task runs report-only while the FREEZE file or a freeze window is active. comfyui_idle_reclaim is deliberately NOT disruptive: its queue has to be empty for 15 minutes before it acts, so stopping it frees the GPU and interrupts nobody -- and a rogue ComfyUI sitting idle is exactly what the owner wants killed at any hour. frozen_rungs = [restart, emergency]: the spike ladder's destructive rungs go report-only in a freeze, while its reclaim and throttle rungs (which protect people) keep running. emergency_level = 4: at pressure level 4 or higher the freeze no longer holds the ladder."
file = "routine.toml"
target = "continuous"
since = "2026-10-03"

[rule.params]
disruptive = ["immich_recycle"]
frozen_rungs = ["restart", "emergency"]
emergency_level = 4

[[rule]]
id = "routine.windows"
title = "Maintenance windows: daily 07:30, weekly Wednesday 07:45, monthly first Saturday 04:30"
kind = "schedule"
principle = "capacity planning"
why = "Windows are chosen around people and backups: after the nightly backups and Plex maintenance, before the evening peak. The weekly window starts 15 minutes after the daily one so the weekly steps follow the daily cleanup of the same morning."
does = "daily = 07:30-09:30 (the daily timer fires at 07:30 plus up to 20 min of random delay), weekly = Wed 07:45-10:00 (after the daily steps), monthly = 1st Sat 04:30-07:00 (after the Saturday 01:00 system backup, about 1.5 hours). Host local time. Steps that need a quiet window run only inside the window; a missed window is reported as missed and never replayed."
file = "routine.toml"
target = "windows"
params = { daily = "07:30-09:30", weekly = "Wed 07:45-10:00", monthly = "1st Sat 04:30-07:00" }
since = "2026-10-03"

[[rule]]
id = "routine.freeze"
title = "Freeze: no disruptive step in the evening 18:00-23:30"
kind = "safety"
principle = "protect before you clean"
why = "Evenings are peak human use of Plex, Immich, Open WebUI and Nextcloud. Nothing that restarts or deletes should run then."
does = "evenings = 18:00-23:30 host time: no disruptive step starts and the freeze-held check-tier restarts are report-only. Read-only steps and the spike ladder's protective rungs are not frozen. `touch /etc/homelab-maint/FREEZE` starts a freeze at once; removing it lifts it. A manual `run --task` does not get past a freeze without --force. jobs.toml [scheduler] freeze (the same window) is used only when this table is missing."
file = "routine.toml"
target = "freeze"
params = { evenings = "18:00-23:30" }
since = "2026-10-03"

[[rule]]
id = "routine.stepopts.spike_review"
title = "Options of the spike review step (none)"
kind = "schedule"
principle = "one umbrella"
why = "Documents that the step takes no options. It is listed so that every step has a place in the registry, even one with nothing to tune."
does = "Empty table: routine_spike_review has nothing to configure."
applies_to = ["routine_spike_review"]
file = "routine.toml"
target = "steps.spike_review"
params = {}
since = "2026-10-03"

[[rule]]
id = "routine.stepopts.smart_selftest"
title = "SMART self-test staleness: 35 days"
kind = "schedule"
severity = "warn"
principle = "capacity planning"
why = "A monthly self-test cadence is the aim; 35 days leaves a few days of slack. Thirty-five days is a monthly cadence with a few days of slack."
does = "max_age_days = 35: a disk with no completed self-test for longer is listed as stale (warn). Read by routine_smart_selftest."
applies_to = ["routine_smart_selftest"]
file = "routine.toml"
target = "steps.smart_selftest"
params = { max_age_days = 35 }
since = "2026-10-03"

[[rule]]
id = "routine.stepopts.image_updates"
title = "Image update review: Diun container name"
kind = "schedule"
principle = "dry-run first"
why = "The review needs to know which container to read. Diun logs 'Image update found' when it sees a newer image, which is all this step reads."
does = "diun_container = diun: the container whose `docker logs --since 168h` the step reads for 'Image update found' lines. Read by routine_image_updates."
applies_to = ["routine_image_updates"]
file = "routine.toml"
target = "steps.image_updates"
params = { diun_container = "diun" }
since = "2026-10-03"

[[rule]]
id = "routine.stepopts.backup_verify"
title = "Backup verification limits"
kind = "schedule"
severity = "warn"
principle = "protect before you clean"
why = "Verification needs explicit limits: how old a backup may be, where the dumps are and what restore files must exist. The 200 hour limit is a weekly backup plus slack, and 26 hours is a nightly one plus slack."
does = "status_glob /var/log/backup/*-status.json; max_age_hours 200 for backup-system and backup-immich; dump_dirs /mnt/backup/system/dbdumps with dumps up to 10 days old (dump_max_age_days) and up to 64 MiB tested with zstd -t (integrity_max_mib); stack_last_ok the ai-stack LAST_OK file no older than 26 hours; restore_files RESTORE.md and restore-system.sh must sit next to the system backup. Read by routine_backup_verify."
applies_to = ["routine_backup_verify"]
file = "routine.toml"
target = "steps.backup_verify"
since = "2026-10-03"

[rule.params]
status_glob = "/var/log/backup/*-status.json"
max_age_hours = { backup-system = 200, backup-immich = 200 }
dump_dirs = ["/mnt/backup/system/dbdumps"]
dump_max_age_days = 10
integrity_max_mib = 64
stack_last_ok = "/media/SandiskSSD/ai-stack-backups/LAST_OK"
stack_backup_max_hours = 26
restore_files = ["RESTORE.md", "restore-system.sh"]

[[rule]]
id = "routine.stepopts.restore_check"
title = "Restore drill settings"
kind = "schedule"
severity = "warn"
principle = "protect before you clean"
why = "Defines what the restore drill compares and how often the owner must do a real restore. Half a year is the longest gap allowed between real restore tests."
does = "restore_dir /mnt/backup/system; sample_files /etc/fstab and /etc/hostname are hashed and compared with the copy under the mirror's root/ directory; max_drill_age_days = 180: the owner's recorded test restore is DUE after that long. Read by routine_restore_check."
applies_to = ["routine_restore_check"]
file = "routine.toml"
target = "steps.restore_check"
since = "2026-10-03"

[rule.params]
restore_dir = "/mnt/backup/system"
sample_files = ["/etc/fstab", "/etc/hostname"]
max_drill_age_days = 180

[[rule]]
id = "routine.stepopts.expiry_check"
title = "Expiry review limits: 30 days warn, 7 days crit"
kind = "schedule"
severity = "crit"
principle = "capacity planning"
why = "A certificate should be renewed long before it expires; 30 days warns and 7 days is an emergency. Thirty days is enough to renew a certificate calmly, seven days means it can no longer wait."
does = "warn_days = 30, crit_days = 7; cert_globs /etc/letsencrypt/live/*/cert.pem and /etc/coolercontrol/coolercontrol.crt. Dated reminders ([[steps.expiry_check.items]]) are not configured. Read by routine_expiry."
applies_to = ["routine_expiry"]
file = "routine.toml"
target = "steps.expiry_check"
since = "2026-10-03"

[rule.params]
warn_days = 30
crit_days = 7
cert_globs = ["/etc/letsencrypt/live/*/cert.pem", "/etc/coolercontrol/coolercontrol.crt"]
