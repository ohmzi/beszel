# homelab-maint rules registry: Schedule and routine. This file DEFINES what the script does; the legacy config files are
# generated from it (homelab-maint rules check | diff | sync).
# task.* rules compile into maint.toml, routine.* rules into routine.toml (windows, freeze, steps, calendar). A step rule only says WHEN a task runs and in what order; what the task deletes is described by the task's own rule (30-cleanup.toml). `severity` is the worst colour the step's task can report; only routine_rotate is a cleaner here (flagged destructive).

[meta]
category = "schedule"
title = "Schedule and routine"
blurb = "When each maintenance step may run."

[[rule]]
id = "task.report_daily"
title = "Daily report: yesterday's health score and what maintenance did"
kind = "schedule"
principle = "one umbrella"
why = "The owner wants one readable page per day instead of 15-minute noise: what was wrong, what the script did and how healthy the host was. It is generated from the script's own records, so it is also the audit trail a human can skim in a minute."
does = "Last step of the daily routine (C0, daily tier). Builds the report for yesterday (local 00:00 to 24:00) from status, history, the audit log, incidents, spikes, changes and SLOs, computes the 0-100 health score (formula version 2, rounded down), and writes STATE_DIR/public/reports/<date>.json plus the shared index, keeping the newest keep = 60 entries. timezone empty = the host zone. ignore_tasks = [] means every check counts towards the score. It only writes its own public files and never touches the host. The digest email is sent by the cli glue only when the day was notable or on Mondays."
applies_to = ["report_daily"]
file = "maint.toml"
target = "tasks.report_daily"
params = { timezone = "", keep = 60, ignore_tasks = [] }
since = "2026-10-03"

[[rule]]
id = "task.report_weekly"
title = "Weekly report: the seven complete days ending yesterday"
kind = "schedule"
principle = "one umbrella"
why = "A weekly view shows slow trends (capacity, noisy checks, spikes) that a daily page hides, and it is the report the owner reads on Wednesday morning with the weekly maintenance. Like the daily report it only reads the script's own records and writes its own public files."
does = "Last step of the weekly routine (C0, weekly tier). Same generator as the daily report over the 7 complete days ending yesterday (id = ISO week, for example 2026-W40); keeps the newest keep = 60 index entries; ignore_tasks = []. The weekly digest email is sent once per report id. Writes only STATE_DIR/public/reports/."
applies_to = ["report_weekly"]
file = "maint.toml"
target = "tasks.report_weekly"
params = { keep = 60, ignore_tasks = [] }
since = "2026-10-03"

[[rule]]
id = "task.routine_spike_review"
title = "Review of the last 24 hours of load spikes"
kind = "check"
severity = "warn"
principle = "detect by saturation, not size"
why = "A spike that restarted or killed something, or a sampler that stopped taking samples, should be looked at by a person even when the host recovered. This is the daily look-back that the 15-minute checks do not give."
does = "C0 daily task with no options. Reads spikes.jsonl for the last 24 h and the spike sampler's samples. Reports the number of spikes, the worst level, whether anything was restarted, stopped or OOM-killed, the top contributors and the sampler coverage (samples against the 96 expected a day). Status warn if something was harmed, coverage is under 60 percent or there are no samples, info if there were spikes, ok otherwise. It reviews and never pages."
applies_to = ["routine_spike_review"]
file = "maint.toml"
target = "tasks.routine_spike_review"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_verify_daily"
title = "Verify the daily routine finished and nothing regressed"
kind = "check"
severity = "warn"
principle = "verify after every change"
why = "Cleanups are only safe if someone checks afterwards. The verify task is that someone: it compares the health checks after the routine with how they were when it began."
does = "Registered C0 task behind the daily `verify` step. Counts the daily routine's steps by state (done, failed, halted, blocked, missed, pending), re-runs the post_check checks (failed_units, disk_forecast, memory_health, plex_media_mount_check, backup_freshness) and compares them with the statuses recorded when the occurrence began, and lists changes not verified. Only REGRESSIONS count: a check already warn at the start is compared with itself. Warn and alert on a regression, a failed, halted or blocked step, or an unverified change."
applies_to = ["routine_verify_daily"]
file = "maint.toml"
target = "tasks.routine_verify_daily"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_capacity"
title = "Weekly capacity review: days to full, growth, memory baseline"
kind = "check"
severity = "warn"
principle = "capacity planning"
why = "Capacity planning means looking ahead before a disk is a page. The weekly review turns what the checks already measured into a short list of things to plan for."
does = "C0 weekly task. From the latest disk_forecast it lists up to 12 mounts ordered by days to full, flags those with 60 days or less, 85 percent used or more, or a warn or crit level; adds runaway growth from growth_watch, Docker images reclaimable at 20 GiB or more, and a container memory baseline that rose by at least 2 GiB and 20 percent over 14 days (a leak hint). Warn when there is a recommendation, never pages."
applies_to = ["routine_capacity"]
file = "maint.toml"
target = "tasks.routine_capacity"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_smart_selftest"
title = "SMART self-test reminder per disk"
kind = "check"
severity = "crit"
principle = "protect before you clean"
why = "A SMART self-test is the only thing that finds some failing sectors before data is lost, and nothing on this host was scheduling one reliably. This task reminds; it never starts a test."
does = "C0 weekly task, needs root. For up to 24 disks from `smartctl --scan` it reads the self-test log without waking a sleeping disk (smartctl -n standby), finds the last completed test and its age, and checks /etc/smartd.conf for a -s schedule and whether smartd runs. warn when a disk was never tested or its last pass is older than 35 days; crit and a page when a self-test FAILED. The reminder text is `smartctl -t short DEV`; the task starts nothing."
applies_to = ["routine_smart_selftest"]
file = "maint.toml"
target = "tasks.routine_smart_selftest"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_updates"
title = "Pending apt and snap updates, reboot and kernel review"
kind = "check"
severity = "warn"
principle = "dry-run first"
why = "Security updates and a pending reboot are things a homelab owner forgets. The weekly review shows them with ages so they can be done at a chosen time, not by surprise."
does = "C0 weekly task, read-only: `apt list --upgradable`, `apt-mark showhold`, `snap refresh --list`, the age of /var/run/reboot-required and whether a newer kernel is installed than the one running. Warn if any security update is pending or a reboot has waited more than 14 days, info for other pending updates. Installs nothing."
applies_to = ["routine_updates"]
file = "maint.toml"
target = "tasks.routine_updates"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_image_updates"
title = "Container image updates announced by Diun in the last 7 days"
kind = "check"
severity = "warn"
principle = "dry-run first"
why = "Updating containers is a decision for the owner, but they need to know what is out of date. Diun already watches registries; this task only reads what it announced."
does = "C0 weekly task. Reads `docker logs --since 168h diun` (container name from the step options), collects images named in 'Image update found' or 'New image found' lines and the time of the last 'Jobs completed' scan. Warn if the last scan is missing or older than 36 h, info when there are updates, ok otherwise. It never pulls or restarts anything."
applies_to = ["routine_image_updates"]
file = "maint.toml"
target = "tasks.routine_image_updates"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_backup_verify"
title = "Backups verified beyond 'did it run'"
kind = "check"
severity = "warn"
principle = "protect before you clean"
why = "A backup that ran but cannot be restored is not a backup. Each week the script checks that the status files, the target disk, the database dumps and the restore tooling are really there and readable."
does = "C0 weekly task. For every /var/log/backup/*-status.json: result ok with no errors, finished within the limit (200 h for the system and Immich backups), target mounted with its warn_free_gb, snapshots kept at least the retention, and for the system backup RESTORE.md and restore-system.sh next to it. Newest database dump per prefix: present, not empty, not older than 10 days, and up to 64 MiB tested with `zstd -t`. The ai-stack LAST_OK file must be newer than 26 h. Warn and alert on any problem."
applies_to = ["routine_backup_verify"]
file = "maint.toml"
target = "tasks.routine_backup_verify"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_verify_weekly"
title = "Verify the weekly routine finished and nothing regressed"
kind = "check"
severity = "warn"
principle = "verify after every change"
why = "Same safety net as the daily verify, for the weekly steps (C2 plans, audits, backup verification). It is a registered task so the routine can run it as a step and the dashboard can show its result."
does = "Registered C0 task behind the weekly `verify` step: counts the weekly routine's steps by state, re-runs the post_check checks against the statuses recorded at the start of the occurrence and lists unverified changes. Warn and alert only for regressions, failed, halted or blocked steps and unverified changes."
applies_to = ["routine_verify_weekly"]
file = "maint.toml"
target = "tasks.routine_verify_weekly"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_restore_check"
title = "Monthly restore drill checklist"
kind = "check"
severity = "warn"
principle = "protect before you clean"
why = "Only a real test restore proves a backup. The script checks what it can (the backup is readable and complete) and keeps the owner honest about the part only a human can do."
does = "C0 monthly task. Automatic items: restore tooling present next to the backup (/mnt/backup/system), newest snapshot has files, sample files (/etc/fstab, /etc/hostname) read back from the mirror, the smallest database dump passes `zstd -t`. Manual item: a test restore by the owner, recorded with `homelab-maint routine ack restore_drill \"what I restored\"`; DUE when never recorded or older than 180 days. Warn when anything fails or is due; a FAIL pages."
applies_to = ["routine_restore_check"]
file = "maint.toml"
target = "tasks.routine_restore_check"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_expiry"
title = "Monthly expiry review: certificates, Tailscale key, dated reminders"
kind = "check"
severity = "crit"
principle = "capacity planning"
why = "Things that stop working on a date (a TLS certificate, a Tailscale node key, a domain renewal) fail without warning unless someone looks ahead. A monthly look gives 30 days of notice."
does = "C0 monthly task. Checks the Tailscale node key expiry, each certificate matching the configured globs (/etc/letsencrypt/live/*/cert.pem, /etc/coolercontrol/coolercontrol.crt) with `openssl x509 -enddate`, and dated reminders from routine.toml [[steps.expiry_check.items]] (none shipped). Warn within 30 days, crit within 7 days or expired; only crit pages."
applies_to = ["routine_expiry"]
file = "maint.toml"
target = "tasks.routine_expiry"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_trends"
title = "Monthly long-term trends: disk slopes, memory baseline, noisy checks"
kind = "check"
severity = "warn"
principle = "capacity planning"
why = "Slow problems only show over weeks. The monthly review fits slopes over the history the runner kept and says honestly how many days it could actually see."
does = "C0 monthly task. Reads up to 90 days of history: least-squares disk free per mount (GiB/day, needs 2 days and 6 samples), warns when a mount has under 90 days left at its slope; the container memory baseline over 30 days; the 3 noisiest checks; the bytes freed by maintenance in 30 days from the audit log. Warn on a concern, never pages."
applies_to = ["routine_trends"]
file = "maint.toml"
target = "tasks.routine_trends"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_verify_monthly"
title = "Verify the monthly routine finished and nothing regressed"
kind = "check"
severity = "warn"
principle = "verify after every change"
why = "Same safety net as the daily and weekly verify, for the monthly window. It is a registered task so the routine can run it as a step and the dashboard can show its result."
does = "Registered C0 task behind the monthly `verify` step: step states of the monthly routine, post_check checks (failed_units, disk_forecast, memory_health, plex_media_mount_check) against the start of the occurrence, unverified changes. Warn and alert on regressions only."
applies_to = ["routine_verify_monthly"]
file = "maint.toml"
target = "tasks.routine_verify_monthly"
params = {}
since = "2026-10-03"

[[rule]]
id = "task.routine_rotate"
title = "Archive old records of the tool's own journals (monthly)"
kind = "cleanup"
severity = "warn"
destructive = true
principle = "dry-run first; protect before you clean"
why = "The tool's own logs (audit, changes, spikes, pressure log) grow forever. Rotating them keeps reports fast while keeping the history, because old records are archived, not discarded."
does = "C1 monthly task. For each target (audit.jsonl keep 90 days, changes.jsonl 365, spikes.jsonl 365, pressure-log.jsonl 180) it moves records older than the cutoff into <dir>/archive/<name>-YYYY-MM.jsonl.gz (gzip members appended) and rewrites the file with the recent records through a temp file and os.replace. Report mode (shipped) only counts the files that have old records. The owner's maintenance journal is never rotated."
proof = "Only .jsonl files directly inside STATE_DIR or LOG_DIR; symlinks, other directories and maintenance-journal.jsonl are refused; keep_days under 7 is refused; archive is written before the file is replaced; every rotation goes through ctx.act (caps, audit, PAUSE). Ships mode = report and the registry rule is flagged destructive so an apply switch is visible."
applies_to = ["routine_rotate"]
file = "maint.toml"
target = "tasks.routine_rotate"
params = {}
mode = "report"
since = "2026-10-03"

[[rule]]
id = "routine.daily"
title = "Daily routine: 21 steps in the 07:30-09:30 window"
kind = "schedule"
principle = "dry-run first; protect before you clean"
why = "Cleaning is safe when it happens at a known quiet time, in a known order, with a check afterwards. The daily routine is that plan for everything that grows a little every day."
does = "Runs inside window `daily` (07:30-09:30 host local time) in the listed order: spike review, Docker cache and images, package caches, snap revisions, retention, app caches, log compression, crash dumps, trash, Gradle daemons, tool caches, Open WebUI media, memory ceilings, QoS classes, then verify and the daily report. canary = true: the first apply run of each cleaner that really changes something uses 10 percent caps. The statuses of failed_units, disk_forecast, memory_health, plex_media_mount_check and backup_freshness are recorded at the first step and compared by the verify step; a regression halts further disruptive steps of the occurrence. The daily tier timer (07:30 plus up to 20 min) and the routine tick (every 15 min) run the steps; each step runs once per occurrence. Every cleaner ships in report mode."
file = "routine.toml"
target = "routine[]"
merge = "append"
since = "2026-10-03"
order = 1

[rule.params]
name = "daily"
cadence = "daily"
window = "daily"
canary = true
post_check = ["failed_units", "disk_forecast", "memory_health", "plex_media_mount_check", "backup_freshness"]

[[rule]]
id = "routine.daily.step.spike_review"
title = "Daily step 1: review last 24 hours of spikes"
kind = "schedule"
severity = "warn"
principle = "detect by saturation, not size"
why = "Starts the day with the one question the 15-minute checks cannot answer: what happened overnight and did the sampler keep up. It only reads the spike ledger, so it can run any time and never waits for the window."
does = "Runs routine_spike_review (C0). Read-only, never waits for the window; reports spikes, harm and sampler coverage (see task.routine_spike_review)."
applies_to = ["routine_spike_review"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["spike_review"] }
since = "2026-10-03"
order = 1

[[rule]]
id = "routine.daily.step.docker_cache"
title = "Daily step 2: trim the Docker build cache"
kind = "schedule"
principle = "dry-run first; protect before you clean"
why = "Build cache is regenerable and grows silently; keeping it under a ceiling stops it eating the root disk without ever touching images or volumes. A size ceiling is acceptable here only because the cache is regenerable; nothing is killed and no volume is touched."
does = "Runs docker_cache (C1). When the cache is over its high mark it would prune least-recently-used entries down to the low mark. Shipped mode report: lists the plan, removes nothing. An apply step waits for the window, the backup and pressure gates, and the canary."
applies_to = ["docker_cache"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["docker_cache"] }
since = "2026-10-03"
order = 2

[[rule]]
id = "routine.daily.step.dangling_images"
title = "Daily step 3: remove dangling images (before tagged unused ones)"
kind = "schedule"
principle = "in-use proof before deletion"
why = "Untagged, unreferenced images are leftovers of builds and pulls. They go first because tagged unused images have a longer grace period."
does = "Runs dangling_images (C1) with disruptive = true, so even in report mode the step waits for the quiet window and the backup and pressure gates. Selects untagged images no container references (running or exited), older than 24 h, needing a fresh image ledger; one `docker image rm ID` each. Report mode ships."
applies_to = ["dangling_images"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = [{ task = "dangling_images", disruptive = true }] }
since = "2026-10-03"
order = 3

[[rule]]
id = "routine.daily.step.docker_images"
title = "Daily step 4: remove tagged images unused for 14 days"
kind = "schedule"
principle = "in-use proof before deletion"
why = "Old image versions pile up after every update. Only images that no container has used for two weeks, by the ledger, are candidates."
does = "Runs docker_images (C1): images not used by any container, not seen in the image ledger within 14 days, not protected; `docker image rm` without force, at most 12 items and 15 GiB per run. Report mode ships."
applies_to = ["docker_images"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["docker_images"] }
since = "2026-10-03"
order = 4

[[rule]]
id = "routine.daily.step.apt_clean"
title = "Daily step 5: empty the apt package cache"
kind = "schedule"
principle = "dry-run first"
why = "Downloaded .deb files are never needed again once installed and can be re-downloaded. The cache sits on the root filesystem, which disk_forecast watches first."
does = "Runs apt_clean (C1): `apt-get clean`, only when no apt or dpkg lock is held; reports the cache size. Never runs autoremove. Report mode ships."
applies_to = ["apt_clean"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["apt_clean"] }
since = "2026-10-03"
order = 5

[[rule]]
id = "routine.daily.step.apt_cache"
title = "Daily step 6: alternative apt cache cleaner (shipped off)"
kind = "schedule"
principle = "dry-run first"
why = "A second version of the same cleaner with a size floor and a measured freed figure; only one of the pair should ever run. Both write to the same cache, so shipping both on would only double the work."
does = "Runs apt_cache (C1), which is disabled in maint.toml (enabled = false), so the step shows 'disabled' and does not hold up verify or report. To use it, enable it and disable apt_clean. Same `apt-get clean`, skipped below 10 MiB."
applies_to = ["apt_cache"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["apt_cache"] }
since = "2026-10-03"
order = 6

[[rule]]
id = "routine.daily.step.stale_driver_packages"
title = "Daily step 7: purge NVIDIA driver packages of other branches"
kind = "schedule"
principle = "in-use proof before deletion"
why = "Old NVIDIA driver branches stay installed after upgrades and take gigabytes; the loaded driver must never be touched. Removing the loaded branch would break the GPU, so the loaded driver is always kept and the simulation must match the purge exactly."
does = "Runs stale_driver_packages (C1): proposes purging apt packages of NVIDIA driver branches other than the loaded one, after dpkg --verify, dkms and an exact `apt-get -s` simulation; max 10 GiB. Report mode ships."
applies_to = ["stale_driver_packages"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["stale_driver_packages"] }
since = "2026-10-03"
order = 7

[[rule]]
id = "routine.daily.step.apt_autoremove_unused"
title = "Daily step 8: purge unused autoremove candidates"
kind = "schedule"
principle = "in-use proof before deletion"
why = "apt autoremove is unsafe to run blindly on a GPU workstation; only libraries and plugins that no process uses are candidates. The allow-list and the proofs keep the GPU driver, kernels, dkms and anything a process uses out of reach (protect before you clean)."
does = "Runs apt_autoremove_unused (C1): examines up to 80 autoremove candidates (one `apt-get -s` each), applies an allow-list policy, the owner keep list (tree, inxi) and built-in never-purge globs, and requires `systemctl --failed` to stay unchanged; 5 GiB per run. Report mode ships."
applies_to = ["apt_autoremove_unused"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["apt_autoremove_unused"] }
since = "2026-10-03"
order = 8

[[rule]]
id = "routine.daily.step.snap_revisions"
title = "Daily step 9: keep two snap revisions"
kind = "schedule"
principle = "dry-run first"
why = "Snap keeps old revisions of every snap; two are enough to roll back and the rest are wasted disk. Plex is a snap, so the setting also decides how many old Plex versions stay on disk."
does = "Runs snap_revisions (C1): sets `snap set system refresh.retain=2` if different and removes disabled revisions, skipping while `snap changes` shows a change in progress; never removes the active revision. Report mode ships."
applies_to = ["snap_revisions"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["snap_revisions"] }
since = "2026-10-03"
order = 9

[[rule]]
id = "routine.daily.step.retention"
title = "Daily step 10: age-based retention of log and backup files"
kind = "schedule"
principle = "in-use proof before deletion"
why = "A few apps write files nobody cleans (Kavita logs and backup zips). Retention by age or count keeps them bounded."
does = "Runs retention (C1): rules kavita-logs (kavita*.log older than 3 days) and kavita-backups (keep newest 3 .zip) inside the allowed roots /volume1/docker/kavita/config and /var/log; mtime based, symlinks never followed, files modified in the last 10 minutes skipped. Report mode ships."
applies_to = ["retention"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["retention"] }
since = "2026-10-03"
order = 10

[[rule]]
id = "routine.daily.step.app_cache_trim"
title = "Daily step 11: trim the Tunarr subtitle cache"
kind = "schedule"
principle = "in-use proof before deletion; protect before you clean"
why = "Tunarr's subtitle cache grows by many small files. It is trimmed by modification time because access times were reset, and only while the app stays healthy."
does = "Runs app_cache_trim (C1) with disruptive = true, so it always waits for the window and gates. Rule tunarr-subtitles: files older than 30 days in the Tunarr cache dir, in batches of 2000 files with a canary batch of 200, re-checking the container health (running plus the health URL) and aborting the rest of the run if it turns unhealthy. Every unlinked file is listed in a manifest. Report mode ships."
applies_to = ["app_cache_trim"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = [{ task = "app_cache_trim", disruptive = true }] }
since = "2026-10-03"
order = 11
owner_notes = "The Tunarr cache is trimmed by modification time because its access times were reset (atime cannot be trusted). The Tunarr protection is lifted for this task only, and only inside the cache/subtitles directory."

[[rule]]
id = "routine.daily.step.log_compress"
title = "Daily step 12: compress large rotated logs"
kind = "schedule"
principle = "in-use proof before deletion"
why = "Rotated logs over 50 MiB are mostly text and compress well; compressing keeps the evidence and frees the space. Compressing instead of deleting keeps the evidence while freeing the space."
does = "Runs log_compress (C1) with disruptive = true: gzip of rotated logs in /var/log (not journal) of 50 MiB or more at least a day old, verified with `gzip -t` and a length check, never a file a process has open or logrotate is rotating; 5 GiB per run. Report mode ships."
applies_to = ["log_compress"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = [{ task = "log_compress", disruptive = true }] }
since = "2026-10-03"
order = 12

[[rule]]
id = "routine.daily.step.crash_dumps"
title = "Daily step 13: remove old crash dumps"
kind = "schedule"
principle = "dry-run first"
why = "Crash dumps are large and rarely read after a couple of days. Short retention keeps a dump available for a debugging session without letting it sit on the root disk for months."
does = "Runs crash_dumps (C1): apport *.crash files older than 2 days in /var/crash and systemd-coredump files older than 7 days in /var/lib/systemd/coredump, inside those two directories only. Report mode ships."
applies_to = ["crash_dumps"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["crash_dumps"] }
since = "2026-10-03"
order = 13

[[rule]]
id = "routine.daily.step.trash"
title = "Daily step 14: empty old items from the trash"
kind = "schedule"
principle = "dry-run first"
why = "Items deleted long ago and still in the trash take space nobody notices. Anything younger than 30 days is still recoverable, which is why the limit is that long."
does = "Runs trash (C1): entries in ~ohmz/.local/share/Trash older than 30 days by deletion date. Report mode ships."
applies_to = ["trash"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["trash"] }
