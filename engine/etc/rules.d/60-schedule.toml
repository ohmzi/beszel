[[rule]]
id = "routine.weekly"
title = "Weekly routine: 17 steps in the Wednesday 07:45-10:00 window"
kind = "schedule"
principle = "dry-run first; protect before you clean"
why = "Weekly tasks are the slow, heavy ones: walks over millions of files, plans needing approval, backup verification and audits. They run once a week in a quiet window after the daily routine."
does = "Window `weekly` (Wed 07:45-10:00 host local). depends_on = [daily]: on Wednesday the disruptive weekly steps wait for the daily window's steps, read-only ones do not. Steps in order: capacity review, SMART reminder, three C2 plans and one C1 walk, Flatpak runtimes, stopped containers, Docker prune parity, bulkhead check, legacy audit, config drift, image updates, update review, backup verification, verify, weekly report. canary = true and the same five post_check checks as the daily routine."
