[[rule]]
id = "routine.daily.step.caps"
title = "Daily step 18: memory ceilings for runaway containers"
kind = "schedule"
principle = "never kill by size; throttle before kill"
why = "A ceiling bounds the damage of a leaking app without killing it: the app is throttled by the kernel instead of being stopped by size. A memory ceiling is a throttle, not a kill, which follows the throttle-before-kill principle."
does = "Runs caps (C1): `docker update --memory C --memory-swap C*1.25` for the containers in its ceilings table (tunarr-host-net 40 GiB, kavita 20, sabnzbd 32, omnivoice-studio-gpu 16, comfyui 48), only when the sampler history is long enough and C is at least 1.25 times the highest memory seen. Idempotent; a stricter existing limit is kept. Report mode ships."
applies_to = ["caps"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["caps"] }
since = "2026-10-03"
order = 18

[[rule]]
id = "routine.daily.step.qos_classes"
title = "Daily step 19: baseline CPU shares per service class"
kind = "schedule"
principle = "classes of service P0-P3"
why = "Classes of service only help if the kernel enforces them: interactive services get more CPU shares than batch work. The shares are the kernel-level half of classes of service (P0 to P3): they decide who yields when the CPU is contended."
does = "Runs qos_classes (C1): applies the baseline cpu-shares per class from classes.toml with `docker update`, idempotent, never lowering a database or touching P0, never fighting an active L3 throttle. Report mode ships."
applies_to = ["qos_classes"]
file = "routine.toml"
target = "@routine.daily:"
merge = "append"
params = { steps = ["qos_classes"] }
since = "2026-10-03"
order = 19

