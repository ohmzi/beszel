[[rule]]
id = "routine.weekly.step.c2_candidates"
title = "Weekly step 3: plan for large old leftovers (needs approval)"
kind = "schedule"
principle = "in-use proof before deletion; dry-run first"
why = "A few big leftovers (old venvs, stale backups, an unused Plex config) are worth reclaiming, but only a human may approve deleting or archiving them. C2 means plan only: the script shows what it would do and a human approves one hash at a time (protect before you clean)."
does = "Runs c2_candidates (C2) with disruptive = true because it runs `du` over big trees (heavy IO) and so waits for the window. It never deletes by itself: it produces a plan with a stable hash (size, last change, in-use check, the exact manual command); applying needs `homelab-maint approve c2_candidates HASH`."
applies_to = ["c2_candidates"]
file = "routine.toml"
target = "@routine.weekly:"
