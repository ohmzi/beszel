does = "Runs tool_caches (C1): npm, pip, uv and pnpm caches of 64 MiB or more, thumbnails older than 30 days, Gradle daemon logs older than 14 days whose daemon is gone, browser cache files older than 7 days while that browser is not running (never profiles); 10 GiB per run. Report mode ships."
applies_to = ["tool_caches"]
