# homelab-maint rules registry: Monitoring probes. This file DEFINES what the script does; the legacy config files are
# generated from it (homelab-maint rules check | diff | sync).
# probe-group.* and probe.* rules compile into probes.toml (a group rule is a [[group]], each probe rule one member), live.* into the [live] table of maint.toml. Probes only read, so none carries a `proof`. The `does` of a probe is generated from its effective values (group defaults, then its own); `severity` is the page a confirmed outage causes (P0 critical, P1 and P2 warning, info never pages).

[meta]
category = "monitoring"
title = "Monitoring probes"
blurb = "Probes and the live monitor: what is watched and how."

[[rule]]
id = "task.probes"
title = "Probes task: folds probe results into the 15-minute status"
kind = "probe"
severity = "crit"
principle = "classes of service P0-P3; one umbrella"
why = "Detection runs every minute in the probes engine, but the rest of the umbrella (dashboard, incidents, alerts, SLOs) works from the check tier's status. This task is the bridge, and the one that pages."
does = "C0 check-tier task. Reads the engine's latest state (probes.json) and returns one result: error and a page 'MONITORING BLIND' if a probes.toml is present but unusable; crit when a crit-severity probe is confirmed down; warn for a confirmed-down warn probe, a degraded or flapping probe, or invalid probe definitions; info for info-only trouble; ok otherwise. alert_mode = task (shipped): the check tier pages on the task level, so a problem is announced up to about 30 minutes after the probe confirmed it (2 runs of the 15-minute tier), and a second probe going down at the same level is not announced until the 24 h reminder. alert_mode = events would instead page per probe from the tick's `probes run --notify` (about 2 minutes after the first failed look) and the check tier then skips the task-level page. Status always stays honest in both modes."
applies_to = ["probes"]
file = "maint.toml"
target = "tasks.probes"
params = { alert_mode = "task" }
since = "2026-10-03"
owner_notes = "The check tier's own run also calls the engine every 15 minutes, so the probe plane keeps working if the tick dies. The Kuma push monitor 'umbrella-probes' is the dead-man's switch for this whole plane."

[[rule]]
id = "live.settings"
title = "Live monitor: 5 second heartbeat and probe cadences"
kind = "probe"
principle = "detect by saturation, not size"
why = "The website's Live tab needs second-level data without loading the host. Cheap /proc reads run every 5 seconds; anything that forks or can hang runs in its own thread on a slower cadence."
does = "homelab-maint-live samples every interval_s = 5 s and rewrites public/live.json (52 KB budget, 720 history points = 60 min). Probe threads: GPU (nvidia-smi) every 10 s, hwmon temperatures every 15 s, fan speeds every 60 s (the fan chip is the dearest read), Docker over its socket every 10 s (only while dockerd is demonstrably up, so asking never starts it), services every 30 s, disk usage every 30 s. A service answering slower than slow_ms = 2000 reads degraded; http_timeout_s = 5 per service. cpu_fans = [1, 4] and case_fans = [2, 3, 5] name the nct6798 fan headers. Read once at start: restart the unit after editing. It only reads the host."
file = "maint.toml"
target = "live"
since = "2026-10-03"
owner_notes = "Mounts default to [tasks.disk_forecast] watch."

[rule.params]
interval_s = 5
gpu = true
sensors = true
docker = true
disk = true
gpu_every_s = 10
sensors_every_s = 15
fans_every_s = 60
docker_every_s = 10
services_every_s = 30
disk_every_s = 30
http_timeout_s = 5
slow_ms = 2000
cpu_fans = [1, 4]
case_fans = [2, 3, 5]

[[rule]]
id = "live.service.plex"
title = "Live tab tile: Plex"
kind = "probe"
principle = "detect by saturation, not size"
why = "Plex is the service the household uses most, so its state is the first tile of the Live tab. Plex is probed natively because Uptime Kuma cannot reach the snap. The tile is a display, not an alert; the probe plane pages."
does = "One tile of the website's Live tab, read every 30 s by homelab-maint-live: http://127.0.0.1:32400/identity plus the unit snap.plexmediaserver.plexmediaserver.service. Plex is a snap, so this tile checks no container. The loopback URL must answer HTTP 200-399 within 2000 ms (slower, or another code below 500, reads degraded; 5xx reads down). The unit is asked only when the fetch fails: then the tile reads down and names the unit state if the unit is not active, or the connection error if it is. Read-only; it pages nothing, the probes do."
file = "maint.toml"
target = "live.services[]"
merge = "append"
since = "2026-10-03"
order = 1

[rule.params]
name = "Plex"
unit = "snap.plexmediaserver.plexmediaserver.service"
url = "http://127.0.0.1:32400/identity"

