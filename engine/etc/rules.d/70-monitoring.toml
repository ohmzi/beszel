[[rule]]
id = "probe-group.platform"
title = "Group Platform (primary): Docker, Cloudflare tunnel, SSH"
kind = "probe"
why = "Everything else on the host stands on these. If Docker, the tunnel or SSH is down the household and the owner lose their services or their way in, so a confirmed outage is a critical page."
does = "Defaults for 5 members: class P0 (critical when confirmed down), availability objective 99.9 percent, every minute, tag platform."
file = "probes.toml"
target = "group[]"
merge = "append"
params = { group = "Platform", class = "P0", slo = 99.9, interval_s = 60, tags = ["platform"] }
since = "2026-10-03"
order = 2

[[rule]]
id = "probe.docker-daemon"
title = "Docker daemon answers"
kind = "probe"
severity = "crit"
principle = "classes of service P0-P3"
why = "About 70 containers depend on it. This asks the daemon itself, which is different from the unit being active."
