[[rule]]
id = "probe-group.umbrella"
title = "Group Umbrella: the monitoring system watching itself"
kind = "probe"
why = "A monitor that cannot notice its own death is dangerous. These probes watch what the umbrella writes (status, probes, public export, live file, ring), its own services and timers and the OhmzMaintainer dashboard, from the one-minute engine, which is a different process from the check tier."
does = "Defaults for the 17 members: class P1 (a confirmed problem is a warning), availability objective 99.5 percent, every minute, tag umbrella. Members override any of it (umbrella-tick is P0). Files are judged by age, services by systemd state, the dashboard by its /api/health and its unit."
file = "probes.toml"
target = "group[]"
merge = "append"
params = { group = "Umbrella", class = "P1", slo = 99.5, interval_s = 60, tags = ["umbrella"] }
since = "2026-10-03"
order = 1

[[rule]]
id = "probe.umbrella-status"
title = "Runner status file is fresh"
kind = "probe"
severity = "warn"
principle = "classes of service P0-P3"
why = "status.json is what the dashboard, the widgets and the website read. If it stops updating they show old numbers as if they were current, so this is the first sign the check tier died."
does = "Checks the age of {STATE}/status.json: its modification time must be under 2700 s (degraded from 1800 s). Every minute; 2 bad runs to go down, 2 good runs to recover. P1, warning: a confirmed outage emails (a text only if it persists). Availability objective 99.5 percent. Pushes its result to the Kuma push monitor 'umbrella-status' (a no-op until kuma.toml holds a token)."
applies_to = ["umbrella-status"]
file = "probes.toml"
target = "@probe-group.umbrella:probes[]"
merge = "append"
since = "2026-10-03"
order = 1

[rule.params]
name = "umbrella-status"
title = "Runner status fresh"
type = "file_age"
target = "{STATE}/status.json"
expect = { max_age_s = 2700, warn_age_s = 1800 }
kuma_push_key = "umbrella-status"

[[rule]]
id = "probe.umbrella-probe-plane"
title = "Probe engine has run recently"
kind = "probe"
severity = "warn"
principle = "classes of service P0-P3"
why = "probes.json is rewritten on every engine run; if it goes stale the one-minute monitoring is not running at all. It is class P1 (what a person is waiting on): it is checked every minute and a confirmed outage emails the owner, with a text only if it persists."
does = "Checks the age of {STATE}/probes.json: its modification time must be under 2700 s (degraded from 1500 s). Every minute; 2 bad runs to go down, 2 good runs to recover. P1, warning: a confirmed outage emails (a text only if it persists). Availability objective 99.5 percent."
applies_to = ["umbrella-probe-plane"]
file = "probes.toml"
target = "@probe-group.umbrella:probes[]"
merge = "append"
since = "2026-10-03"
order = 2

[rule.params]
name = "umbrella-probe-plane"
title = "Probe plane running"
type = "file_age"
target = "{STATE}/probes.json"
expect = { max_age_s = 2700, warn_age_s = 1500 }

[[rule]]
id = "probe.umbrella-tick"
title = "Scheduler tick is beating"
kind = "probe"
severity = "crit"
principle = "classes of service P0-P3"
why = "The tick runs the backups, the cleaners and this very engine every minute. The timer unit can stay 'active (waiting)' while every tick fails, so unit liveness proves nothing: the beat itself, the number of loaded jobs and the count of refused job definitions are judged. A jobs.toml typo leaves the beat fresh but schedules nothing."
does = "Reads {RUN}/tick.json as JSON; requires: t is not older than 300 s (warn from 150 s); jobs is at least 1; config_problems is at most 0. Every minute; 2 bad runs to go down, 2 good runs to recover. P0, critical: a confirmed outage pages by SMS and email. Availability objective 99.5 percent. optional: never seen up means 'skipped' (not deployed yet), not an alert."
applies_to = ["umbrella-tick"]
file = "probes.toml"
target = "@probe-group.umbrella:probes[]"
merge = "append"
since = "2026-10-03"
order = 3
owner_notes = "Optional until the first tick has been seen (a fresh install has no tick yet)."

[rule.params]
name = "umbrella-tick"
title = "Scheduler tick beating"
type = "json"
target = "{RUN}/tick.json"
class = "P0"
optional = true

[rule.params.expect]
json = [
  { path = "t", age_max_s = 300, age_warn_s = 150 },
  { path = "jobs", min = 1 },
  { path = "config_problems", max = 0 },
]

