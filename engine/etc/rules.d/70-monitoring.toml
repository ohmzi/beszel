does = "One tile of the website's Live tab, read every 30 s by homelab-maint-live: container immich_server and http://127.0.0.1:2283/api/server/ping. The container must exist and be running (unhealthy or still starting reads degraded) and the loopback URL must answer HTTP 200-399 within 2000 ms (slower reads degraded; 5xx or a closed port reads down). Read-only; it pages nothing, the probes do."
