[[rule]]
id = "probe.ct-fleet"
title = "All containers are running and healthy"
kind = "probe"
severity = "warn"
principle = "classes of service P0-P3"
why = "With about 70 containers one probe per container would be noise. The fleet probe judges every container's state and health in a single row and names the offenders."
does = "Looks at every container in `docker ps -a`: any that is not running, or is unhealthy, or that was established (running at least 6 h) and vanished within the last 3 days (`docker rm`, compose down) makes it down, except names matching ^comfyui$. Every 2 minutes; 2 bad runs to go down, 2 good runs to recover. P2, warning: a confirmed outage emails (a text only if it persists). Pushes its result to the Kuma push monitor 'containers' (a no-op until kuma.toml holds a token)."
applies_to = ["ct-fleet"]
file = "probes.toml"
target = "probe[]"
merge = "append"
since = "2026-10-03"
order = 1
owner_notes = "comfyui (stopped by design) is the only exclusion. A container that vanishes (docker rm, compose down) leaves no stopped corpse, so established ones are remembered and reported 'missing' for 3 days; `probes forget NAME` ends it."

[rule.params]
name = "ct-fleet"
title = "All containers running and healthy"
type = "docker"
target = "*"
class = "P2"
group = "Containers"
interval_s = 120
tags = ["containers"]
expect = { except = ["^comfyui$"] }
kuma_push_key = "containers"

[[rule]]
id = "probes.defaults"
title = "Probe engine defaults: 2 looks, 2 bad runs to go down, 5 minute interval"
kind = "probe"
principle = "classes of service P0-P3; fail closed"
why = "A monitoring plane that cries wolf is worse than none. These defaults make a blip invisible and a real outage visible quickly: look twice, believe it after two runs, and treat a restart storm as one event."
does = "workers = 8 threads and budget_s = 45 s per run (a probe the budget ran out before starting is first in line next tick; one that started and did not finish is a failure). timeout_s = 5 per look, interval_s = 300 per probe unless it says otherwise (the engine is called every minute and runs each probe when its own interval elapsed). confirm = 2 and recover = 2: two bad runs to go down, two good to come back. attempts = 2 looks per run, retry_s = 5 s apart, best look wins. flap_window_s = 3600 and flap_max = 4: four confirmed changes in an hour is 'flapping' (counted as warn, quiet while it keeps changing, announced anyway once a level has held for the longer of 10 minutes and two of the probe's intervals). storm_max = 8: more changes than that in one run become ONE summary event (a host stall fails everything at once). history_every_s = 300 writes the compact availability records, keep_days = 30. deadman_key = umbrella-probes is the Kuma push key of the dead-man's switch."
file = "probes.toml"
target = "defaults"
since = "2026-10-03"
owner_notes = "Availability is time-honest: when the engine itself did not run (power cut, dead tick) the missing samples are booked as failed and unobserved."

[rule.params]
workers = 8
budget_s = 45
timeout_s = 5
interval_s = 300
confirm = 2
recover = 2
attempts = 2
retry_s = 5
flap_window_s = 3600
flap_max = 4
storm_max = 8
history_every_s = 300
keep_days = 30
deadman_key = "umbrella-probes"

[[rule]]
id = "probes.kuma"
title = "Uptime Kuma parity: group map and ignore list"
kind = "probe"
principle = "one umbrella"
why = "Uptime Kuma stays because the Homarr uptime widget reads it, but the probe plane is the source of truth. Every Kuma monitor must be carried by a probe so nothing is watched in only one place."
does = "groups maps the Kuma group monitor 'Media Stack' to the probe group of the same name. ignore is empty. `probes kuma-diff COPY_OF_KUMA_DB` lists any Kuma monitor that no probe carries (via its `kuma` key); Kuma itself is never written to."
file = "probes.toml"
target = "kuma"
params = { groups = { "Media Stack" = "Media Stack" }, ignore = [] }
since = "2026-10-03"
