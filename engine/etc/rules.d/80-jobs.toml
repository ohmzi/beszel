severity = "warn"
principle = "one umbrella; classes of service P0-P3"
why = "All monitoring (services, containers, endpoints, files) goes through one engine so a failed thing is noticed within minutes and not within the 15-minute check tier. It runs every minute because detection must not wait for the 15-minute check tier."
does = "Runs `python3 -m homelab_maint.probes run --notify` as root every minute, class P1, monitor, timeout 90 s (the engine's own budget is 45 s); each probe keeps its own interval, so an idle run costs about 10 ms. --notify delivers per-probe events only when [tasks.probes] alert_mode = events; with the shipped task mode the check tier pages. There is no legacy driver, so it ships managed (the tick runs it). The check tier's probes task also calls the engine, so monitoring continues if the tick stops."
applies_to = ["probes-run"]
file = "jobs.toml"
target = "job[]"
merge = "append"
since = "2026-10-03"
order = 18

[rule.params]
