principle = "in-use proof before deletion; dry-run first"
why = "Every visit to the public instance mints a user row and nothing prunes them, so the database grows with traffic. This script removes guest accounts idle for a day."
does = "Would run purge_public_guests.py --yes as ohmz daily at 05:20 (jitter 10 min), class P3, timeout 5 min. It deletes only accounts whose email is exactly guest-<32 hex>@public.ohmz.cloud and idle for more than 24 h, through Open WebUI's own DELETE API (which also refuses to touch the admin or the caller). It was never scheduled before (a gap, not a retirement). exit 1 means the admin door was unreachable (warn). Ships observe; `migrate cutover purge-public-guests` adopts it."
proof = "Narrow email pattern, 24 h idle limit, deletion through the application's API. The script is a dry run unless --yes is given; the job's command carries --yes, but an observe job is never started by the tick, so nothing is deleted until `migrate cutover purge-public-guests` adopts it."
applies_to = ["purge-public-guests"]
file = "jobs.toml"
target = "job[]"
merge = "append"
since = "2026-10-03"
order = 20

[rule.params]
