[[rule]]
id = "sched.settings"
title = "Scheduler limits: 3 at once, 6 h catch-up, evening freeze, forced-start pressure"
kind = "schedule"
principle = "classes of service P0-P3"
why = "One tick starts everything on a schedule, so it needs a few global limits that keep the host usable: not too many things at once, no catching up on ancient runs, no disruptive starts at peak hours, and no forced start while the host is under pressure. The values are deliberately conservative: a job that cannot run now can usually run later, and a backup is the exception handled by force_after_defer."
does = "max_concurrent = 3 non-monitor jobs at the same time. catchup_hours = 6: a missed or deferred occurrence older than this is skipped, not run (a job may set its own). freeze = [18:00-23:30]: disruptive jobs wait it out; this list applies only when routine.toml has no [freeze] table (routine.toml is the first choice). forced_pressure_max = 1: a job started by force_after_defer (backups, the Immich recycle) still waits while the pressure gate level is above 1, or above its own pressure_max when that is higher (the Immich recycle sets 3). Other limits (tick budget 40 s, defer retry 120 s, gate timeout 20 s, 20 logs kept per job) are built-in defaults."
file = "jobs.toml"
target = "scheduler"
params = { max_concurrent = 3, catchup_hours = 6, freeze = ["18:00-23:30"], forced_pressure_max = 1 }
since = "2026-10-03"

[[rule]]
id = "sched.pressure_max"
title = "Highest pressure level at which each class may start a job"
kind = "schedule"
principle = "classes of service P0-P3; detect by saturation, not size"
why = "Classes of service in action: interactive and monitoring work (P0, P1) starts even under pressure because it helps diagnose it, while batch work (P2, P3) must not add load to a host that is already stalling. Detection is by saturation (memory and CPU stalls), not by how much memory is in use."
does = "A job of class P0 or P1 may start at any pressure level up to 5; P2 and P3 only up to level 1, so they are deferred at level 2 and above. The level is pressure_state's gate_level (memory and CPU only): this host holds IO pressure at level 3 for hours every night and that must not defer a backup. A job may override it with its own pressure_max (the ComfyUI reclaim and the Immich recycle do, because they relieve memory)."
file = "jobs.toml"
target = "scheduler.pressure_max"
params = { P0 = 5, P1 = 5, P2 = 1, P3 = 1 }
since = "2026-10-03"
