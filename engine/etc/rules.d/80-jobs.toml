# homelab-maint rules registry: Jobs. This file DEFINES what the script does; the legacy config files are
# generated from it (homelab-maint rules check | diff | sync).
# job.* and external.* rules compile into jobs.toml, sched.* into its [scheduler] tables. Every job ships mode observe (the legacy driver still starts it) except probes-run and routine-run (managed) and mem-guard (retired). `destructive` marks a job whose command deletes, restarts or purges something; `severity` is what a failed run raises.

meta = { category = "jobs", title = "Jobs", blurb = "Scheduled jobs and the timers the host runs." }

[[rule]]
id = "job.backup-system"
title = "System-drive backup, Saturday 01:00"
kind = "job"
severity = "crit"
principle = "protect before you clean; classes of service P0-P3"
why = "A dead NVMe must be replaceable and the machine must boot again from the backup. This is that protection: the disk layout, the database dumps, the EFI partition and a file mirror of the root filesystem, kept with rotating snapshots on a separate disk."
does = "Runs /usr/local/sbin/backup-system.sh as root, Saturdays 01:00 (jitter up to 15 min), class P2, heavy and backup (heavy jobs never start while a backup runs, and it takes the heavy mutex). catchup_hours 160: a missed Saturday still runs (a new one supersedes at 168 h). A busy gate or pressure may defer it for up to 12 h, then force_after_defer starts it anyway (a forced start still waits for the heavy-job mutex, the legacy-timer interlock and any pressure above level 1). No timeout (a first run copies 1.5-1.7 TB), nice 10, ionice best-effort 7, requires /mnt/backup/system to be a mountpoint. pausable = false: the global PAUSE must never silently stop a backup. A run lost to a reboot is retried once 30 minutes later. self_notifies = true: the script alerts through Hermes itself, the umbrella only reports abnormal ends. Success is judged from /var/log/backup/system-status.json (result ok, fresh within 200 h). A good run sends a maintenance message, a failure an alert, and a forced start still blocked at its limit alerts once (on_expire). Ships mode = observe: the legacy driver still starts it and the tick only shows its next run and last result (from the job's own status)."
proof = "Same command, user, environment, nice and ionice as the legacy unit (checked by migrate's unit_equiv before cutover); the tick refuses to start it while backup-system.timer is still enabled or active, so it can never run twice."
applies_to = ["backup-system"]
file = "jobs.toml"
target = "job[]"
merge = "append"
since = "2026-10-03"
order = 1
owner_notes = "Cut over last (docs/MIGRATION.md): soak every other job first. The OnFailure unit backup-failure@.service stays until the hook is verified."

[rule.params]
name = "backup-system"
title = "System-drive backup (BK-SYSTEM)"
command = ["/usr/local/sbin/backup-system.sh"]
user = "root"
schedule = "0 1 * * sat"
jitter_s = 900
class = "P2"
heavy = true
backup = true
catchup_hours = 160
max_defer_hours = 12
force_after_defer = true
timeout_s = 0
nice = 10
ionice_class = 2
ionice_prio = 7
self_notifies = true
max_attempts = 2
retry_on = ["lost"]
retry_backoff_s = [1800]
pausable = false
retire = ["system:backup-system.timer"]
requires_mounts = ["/mnt/backup/system"]
mode = "observe"
note = "Cutover last (docs/MIGRATION.md): soak every other job first. The OnFailure unit backup-failure@.service stays until the hook below is verified."
hooks = { on_failure = ["/usr/local/sbin/backup-failed.sh", "backup-system.service"] }

[rule.params.success]
exit_codes = [0]
status_json = "/var/log/backup/system-status.json"
result_key = "result"
ok_values = ["ok"]
finished_key = "finished"
warn_key = "warnings"
reason_key = "reason"
max_age_hours = 200
summary = "{job} backup {result}: {duration_short}, {space}, {free_gb_after}G free, {snapshots_kept} snapshots"
fail_summary = "{job} backup {result} after {duration_short}: {reason}"

[rule.params.notify]
on_failure = "alert"
on_success = "maintenance"
on_expire = "alert"
detail_file = "/var/log/backup/system-detail.txt"
title = "System-drive backup"

