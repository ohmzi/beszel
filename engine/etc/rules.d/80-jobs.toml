[[rule]]
id = "job.comfyui-idle-vram"
title = "ComfyUI idle-VRAM reclaim (legacy script), every 5 minutes"
kind = "job"
severity = "warn"
destructive = true
principle = "throttle before kill; in-use proof before deletion"
why = "ComfyUI keeps its model in VRAM between jobs, so 10-16 GB sit unused while Plex NVENC and Immich ML want the GPU. Restarting it when it is idle frees the memory."
does = "Would run /usr/local/bin/comfyui-idle-vram.sh as root every 5 minutes, class P3, quiet (only failures are recorded), timeout 10 min. pressure_max 5: it frees GPU memory, so pressure is a reason to run it, not to wait. It restarts the comfyui container only when the queue is empty (an error counts as busy) AND the process holds more than 3000 MB on two consecutive checks. A failure alerts after 3 confirmations. Replaced by the comfyui_idle_reclaim task. Ships mode = observe: the legacy driver still starts it and the tick only shows its next run and last result (from the job's own status)."
proof = "Two-strike rule with the strike kept in /run; queue error is treated as busy so a running job is never interrupted."
applies_to = ["comfyui-idle-vram"]
file = "jobs.toml"
target = "job[]"
merge = "append"
since = "2026-10-03"
order = 10
owner_notes = "ComfyUI is stopped by design on this host (expected_stopped_containers); with it stopped the script has nothing to restart."

[rule.params]
name = "comfyui-idle-vram"
title = "ComfyUI idle-VRAM reclaim"
command = ["/usr/local/bin/comfyui-idle-vram.sh"]
user = "root"
schedule = "1-56/5 * * * *"
class = "P3"
pressure_max = 5
quiet = true
timeout_s = 600
catchup_hours = 0.1
fail_status = "warn"
retire = ["system:comfyui-idle-vram.timer"]
replaced_by = "comfyui_idle_reclaim"
mode = "observe"
note = "Two-strike rule keeps its strike file in /run; the port keeps strikes in task state."
notify = { on_failure = "alert", on_success = "none", confirm = 3 }

