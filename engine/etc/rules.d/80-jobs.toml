[[rule]]
id = "job.immich-server-recycle"
title = "Immich server recycle (legacy unit), every 2 hours"
kind = "job"
severity = "warn"
destructive = true
principle = "throttle before kill; classes of service P0-P3"
why = "The Immich server grows in memory over hours; a restart every two hours keeps it bounded, but only when nobody is using it. Restarting at the wrong moment would interrupt an upload or a job, which is why it goes through the Immich gate and waits out the evening freeze."
does = "Would run `docker restart immich_server` as root every 2 hours (:24), class P2, disruptive (waits out the evening freeze), gated by immich-recycle (busy means defer, idle means restart), max_defer 12 h then force_after_defer, pressure_max 3 (the restart relieves memory, so only a real stall waits), timeout 5 min. A failure alerts. Replaced by the immich_recycle task. Ships mode = observe: the legacy driver still starts it and the tick only shows its next run and last result (from the job's own status)."
proof = "Only runs when the Immich gate says idle: no backup or prune unit active, and immich_server, immich_machine_learning and immich_postgres each under 15 percent of one core over 10 s (the CPU stands in for running jobs; the job queues are not read). After 12 h of deferral a forced start beats the gate and the freeze but still waits while the pressure gate level is above 3 (its own pressure_max raises the forced-start limit of 1 to 3) and while a backup runs."
applies_to = ["immich-server-recycle"]
file = "jobs.toml"
target = "job[]"
merge = "append"
since = "2026-10-03"
order = 12
owner_notes = "At cutover the drop-in /etc/systemd/system/immich-server-recycle.service.d/10-homelab-gate.conf must be retired too."

[rule.params]
