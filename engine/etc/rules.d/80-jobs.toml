[[rule]]
id = "job.docker-prune"
title = "Weekly Docker cleanup (legacy script), Sunday 04:00"
kind = "job"
severity = "crit"
destructive = true
principle = "in-use proof before deletion; dry-run first"
why = "The old script prunes Docker in one go. It is replaced by the native cleaners (build cache, unused images, long-stopped containers) that know what must be kept; until they are proven the legacy command is described here."
does = "Would run /usr/local/sbin/docker-prune.sh as root Sundays 04:00 (jitter 15 min), class P3, heavy, gated by docker_build (never while an image is being built), timeout 3 h. The script removes containers stopped for over 7 days, then `image prune --all` for images no container references that are older than 7 days (a stopped container's image is released by step one), then prunes the build cache of every buildx builder (7 days, 20 GB ceiling). It never prunes volumes. replaced_by docker_cache + docker_images (+ docker_containers_prune). Success summary is the 'after:' line of /var/log/docker-prune.log; a good run sends a maintenance message and a failed one is a critical alert (default fail_status). Ships mode = observe: the legacy driver still starts it and the tick only shows its next run and last result (from the job's own status)."
proof = "Not started by the tick while docker-prune.timer is enabled or active. docker_prune_parity must be green before cutover, and docker_prune_exposure pages while the legacy timer is on and would delete something the natives keep."
applies_to = ["docker-prune"]
file = "jobs.toml"
target = "job[]"
merge = "append"
since = "2026-10-03"
order = 8
owner_notes = "docker-prune.timer was DISABLED by the owner on 2026-10-02 because it would have removed ComfyUI's stopped container and then its 14.9 GiB image. Nothing in install.sh enables it and this rule must not either."

[rule.params]
name = "docker-prune"
title = "Weekly Docker cleanup"
command = ["/usr/local/sbin/docker-prune.sh"]
user = "root"
schedule = "0 4 * * sun"
jitter_s = 900
class = "P3"
heavy = true
gates = ["docker_build"]
catchup_hours = 72
timeout_s = 10800
retire = ["system:docker-prune.timer"]
replaced_by = "docker_cache + docker_images (+ docker_containers_prune)"
mode = "observe"
env = { DOCKER_CONFIG = "/home/ohmz/.docker" }
success = { exit_codes = [0], summary_file = "/var/log/docker-prune.log", summary_regex = "after: (.*)$" }
notify = { on_failure = "alert", on_success = "maintenance", title = "Docker cleanup" }

