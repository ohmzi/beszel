[[rule]]
id = "job.mem-guard"
title = "mem-guard (retired): dry run every 3 hours"
kind = "job"
principle = "never kill by size; detect by saturation, not size; throttle before kill"
why = "mem-guard.py restarts containers and kills host processes that merely hold more than a memory threshold, the kill-by-size behaviour this project rejects in favour of detecting saturation. The timer only ever ran it with --dry-run, and the pressure ladder with the stuck detector replaces it. It stays listed so the schedule is complete."
does = "mode = retired: the tick never runs it. The recorded command is mem-guard.py --threshold-gib 5 --dry-run every 3 hours, class P3; without --dry-run the script would `docker restart` containers over 5 GiB and send SIGTERM then SIGKILL to other processes not on its protected list. replaced_by pressure_state + stuck_detector. The legacy mem-guard.timer is to be retired at cutover."
applies_to = ["mem-guard"]
file = "jobs.toml"
target = "job[]"
merge = "append"
since = "2026-10-03"
order = 13

[rule.params]
name = "mem-guard"
title = "mem-guard (retired)"
command = ["/usr/local/sbin/mem-guard.py", "--threshold-gib", "5", "--dry-run"]
user = "root"
schedule = "0 */3 * * *"
class = "P3"
retire = ["system:mem-guard.timer"]
replaced_by = "pressure_state + stuck_detector"
mode = "retired"
note = "Dry-run only and superseded by the pressure ladder; documented here so the schedule is complete, never run by the tick."

[[rule]]
id = "job.tier-check"
title = "Check tier: every 15 minutes"
kind = "job"
severity = "warn"
principle = "one umbrella; classes of service P0-P3"
why = "The 15-minute checks are the umbrella's eyes. They keep their own systemd timer on purpose, because that is what notices when the one-minute tick dies."
does = "Runs `homelab-maint run --tier check --apply` as root every 15 minutes (jitter 60 s), class P1, monitor, timeout 14 min, nice 10, ionice idle, oom_score_adj 500 (given up first if memory runs out). --apply only PERMITS mutation: C0 checks stay read-only and every C1 task still needs mode = apply (only the pressure ladder's reclaim rung ships on). Exit 1 (a task errored) is a warn. Ships mode = observe: the legacy driver still starts it and the tick only shows its next run and last result (from the job's own status)."
applies_to = ["tier-check"]
file = "jobs.toml"
target = "job[]"
merge = "append"
since = "2026-10-03"
order = 14
owner_notes = "Stays observe on purpose: homelab-maint-check.timer is the permanent driver of this tier. Keep the command equal to systemd/homelab-maint-check.service."

[rule.params]
name = "tier-check"
title = "Health checks (check tier)"
command = ["{self}", "run", "--tier", "check", "--apply"]
user = "root"
schedule = "*/15 * * * *"
jitter_s = 60
source = "native"
class = "P1"
monitor = true
timeout_s = 840
nice = 10
ionice_class = 3
oom_score_adj = 500
catchup_hours = 0.5
fail_status = "warn"
retire = ["system:homelab-maint-check.timer"]
mode = "observe"
success = { exit_codes = [0], warn_exit_codes = [1] }
notify = { on_failure = "none", on_success = "none" }

