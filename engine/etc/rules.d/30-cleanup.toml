[[rule]]
id = "c2.cursor-worktrees"
title = "Cursor worktrees (old git worktrees under ~/.cursor)"
kind = "cleanup"
why = """\
  ~/.cursor/worktrees holds git worktrees kept by Cursor; 17 old ones were noted when the candidate was \
