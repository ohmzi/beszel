[[rule]]
id = "task.flatpak_unused"
title = "Unused Flatpak runtimes: uninstall --unused, runtimes only"
kind = "cleanup"
why = """\
  Flatpak leaves runtimes and extensions behind when the app that needed them is removed or updated, and they \
  can take GiB. flatpak itself knows which are unused (pins, extensions, end-of-life rebases), so the rule \
  asks flatpak first and adds its own safety net on top."""
does = """\
  Weekly routine step (needs root). For each installation in `installations` (default: the system installation \
  only) runs `flatpak uninstall --unused` with 'n' answered, to see what it WOULD remove. Only if every listed \
  ref is an installed runtime or extension, never an application, and none is used by a running sandbox does \
  it run `flatpak uninstall --unused -y --noninteractive` for that installation. The cap of 10 GiB is per run, \
  summed over the installations; an installation whose list alone is bigger is skipped as over the cap. \
  Afterwards the set of installed applications must be unchanged, else crit. Report-only in the shipped \
  config."""
applies_to = ["flatpak_unused"]
file = "maint.toml"
target = "tasks.flatpak_unused"
params = { max_gib_per_run = 10 }
mode = "report"
severity = "crit"
destructive = true
proof = """\
  The whole installation is refused when any listed ref is not a runtime; when an app of another installation \
  (a user app on a system runtime) uses a listed runtime, which flatpak's own list ignores; when a running \
  sandbox uses one (matched by commit against every /proc/*/root/.flatpak-info); when a flatpak command is \
  running; or when /proc is not fully readable (no root). The unused list is read again right before the \
  removal and must be identical. The routine's canary caps the first apply run at 10 percent."""
principle = "in-use proof before deletion; capacity planning"
since = "2026-10-03"

[[rule]]
id = "task.swap_auto_relief"
title = "Automatic swap relief (empty a quiet, cold, nearly full swap that hangs around)"
kind = "cleanup"
why = """\
A swap that is nearly full of pages nobody has touched for hours is not a fault, but it is a risk: with no free swap left, the next real \
memory spike goes to the OOM killer instead of a slowdown. The industry standard (systemd-oomd, Meta's oomd, the proactive-reclaim work) \
never judges how full swap is; it judges pressure and refaults, because idle pages parked in swap are working as intended and only \
a swap that is in use or a stalled system is a problem. So this rule acts only on swap that is full, quiet and cold for long enough, and \
it clears it without touching any process: swapoff moves the pages back to RAM, swapon puts the empty area back."""
does = """\
Every check run it samples swap-in and swap-out, the memory stall, and for every cgroup that holds swap its refaults (workingset_refault_anon). \
A holder refaulting fewer than cold_refault_pps (5) pages per second is cold (idle), more is active. The swap is hanging around when it is \
at least trigger_pct (80) full, quiet (no swap-in worth the name, no memory stall) and at least min_cold_share (0.7) of it is held by cold \
holders, continuously for persist_hours (2); the watch only ends when swap falls under release_pct (60) or the cold share under min_cold_share minus 0.2, so it does not flap around the line, but a real change of character stops it. \
Time it did not watch (host down, PAUSE, missed runs) never counts: a gap over max_gap_hours (0.75) restarts the timer. It acts only inside the maintenance window (local window_start_hour to window_end_hour, 2 to 6), because swapoff can stall a process that maps memory while its pages are read back, which the busy gates cannot see. Quiet also means swap-out under quiet_out_mib_s (8). \
Only then it checks every precondition of the relief again: free RAM for the pages with headroom to spare, every protected workload idle (the busy \
gates: ComfyUI, Ollama, Plex, backups, builds, Immich), the swap disk quiet, no memory stall, and the memory.max and memory.high of every cgroup that holds swap, small ones included, and of each of its ancestors, large enough to take \
its pages back (swapped-in pages are charged to those limits), with relief_headroom_gib (16 GiB, or 15 percent of RAM) left free, clear of the host's own memory warnings. A blocked relief is retried each run and never forced; blocked for max_defer_hours (24) \
it becomes a visible warning, not a page. When everything holds and mode is apply it starts the relief as its own systemd unit \
(homelab-maint-swap-relief, at most 45 minutes, nice 19), which refuses unless the rule is in apply mode and the kill switch is absent, aborts and keeps the swap if \
available RAM or the memory stall turns bad, PAUSE appears or the rule leaves apply mode (checked every few seconds), and always runs swapon again (the unit also runs swapon -a when it stops, however it stops). At most one automatic relief per min_interval_hours (12). A launch is never booked as a relief: the task reads the OUTCOME the relief wrote to its ledger. A relief that was refused, aborted or left no outcome backs off (retry_hours, doubling, at most 24 hours) and after max_failed_attempts (3) shows as a warning. Circuit breaker: if swap is back above trigger_pct within \
refill_hours (6) after breaker_after_refills (2) confirmed reliefs in a row, the workload does not fit in RAM or something leaks, so the automation pauses for \
breaker_days (3) and the owner is paged with the top holders (the notifier confirms it on two runs in a row, sends one page and then a reminder every 24 hours). A relief the owner runs by hand and one the automation runs are recorded in the \
relief ledger, so the swap-in they cause is never read as pressure by any other check or by the pressure ladder. In report mode it only says what it would do."""
applies_to = ["swap_auto_relief"]
file = "maint.toml"
target = "tasks.swap_auto_relief"
params = { disruptive = true, trigger_pct = 80.0, release_pct = 60.0, persist_hours = 2.0, min_cold_share = 0.7, cold_refault_pps = 5.0, min_interval_hours = 12.0, refill_hours = 6.0, breaker_after_refills = 2.0, breaker_days = 3.0, max_defer_hours = 24.0, quiet_out_mib_s = 8.0, window_start_hour = 2.0, window_end_hour = 6.0, max_gap_hours = 0.75, retry_hours = 1.0, max_failed_attempts = 3.0, sample_s = 3 }
mode = "report"
severity = "warn"
destructive = true
proof = """\
No process is ever killed or restarted: swapoff only moves pages back to RAM and swapon restores the area. It starts only when free RAM covers the \
pages with headroom, every busy gate (fail closed: a probe error counts as busy) is idle, the swap disk is quiet, memory stall is calm and the memory.max and memory.high of every holder and ancestor fit its resident plus swapped memory. The relief aborts on a signal (the area stays in service) the moment available RAM or the \
memory stall turns bad, always runs swapon again, and the check also warns if /etc/fstab lists swap that is not on. Report-only until switched on."""
principle = "act on saturation and persistence, never on size; relieve only without hurting work in progress"
owner_notes = """\
Ships in report mode like every cleaner. Switch it on with mode = apply on this rule in the host registry, then rules check and rules sync. \
Pause it with homelab-maint pause (the kill switch) or set mode back to report: either also stops a relief that is already running, which leaves the swap in service. A freeze holds it (disruptive = true). Its safety limits are the relief_* options of task.swap_audit. The same relief by hand: homelab-maint swap relieve --apply (no window, no persistence: the owner decides). If swap that /etc/fstab lists is found off (a relief killed between swapoff and swapon), this task switches it back on with swapon -a."""
since = "2026-10-03"
