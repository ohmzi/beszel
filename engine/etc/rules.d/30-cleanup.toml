[[rule]]
id = "task.stale_build_output"
title = "Stale build output: target, .next, __pycache__ and similar in projects idle for 90 days"
kind = "cleanup"
why = """\
  Rust target folders, .next, .turbo and pycache of old projects run to many GiB (103 build-named folders were \
  found under StudioProjects) and the next build recreates them. Deleting one is only safe when nobody works \
  on the project and the folder is provably tool output, not somebody's hand-made one."""
does = """\
  Weekly routine step (heavy: it walks StudioProjects, about 1.3 million entries, and runs git per candidate; \
  needs root). Finds folders named target, dist, build, .next, .turbo, __pycache__, .pytest_cache, .mypy_cache \
  or .vitepress/dist up to max_depth (7) under /home/ohmz/StudioProjects. A folder is selected only when ALL \
  hold: it is git-ignored with nothing tracked or staged in it; every enclosing repo, its linked worktrees and \
  its working files are idle for idle_days (90); the output is untouched for output_days (30); it carries its \
  tool's signature (cargo CACHEDIR.TAG, .next BUILD_ID, only .pyc ...) and none of backup or patch files, \
  .env, databases, keys, signed apks or files of another owner; no container bind-mounts the project; no \
  process has its cwd, an open or mapped file, or an argv path in the project; no unit, cron entry, launcher, \
  rc file, nginx or caddy config, run file or symlink points at it; and it holds no mount point. dist and \
  build are only listed (apply_generic = false) because they are not provably regenerable. Caps: 200 folders \
  and 30 GiB per run. Report-only in the shipped config."""
applies_to = ["stale_build_output"]
file = "maint.toml"
target = "tasks.stale_build_output"
mode = "report"
severity = "warn"
destructive = true
proof = """\
  Fail closed on any probe error: an unreadable /proc, unknown docker mounts, a git failure, a scan past its \
  900 s budget, or a clock that cannot be trusted (NTP unsynchronised and far from the tool's last write). The \
  docker_build and gradle gates must be idle. Deletes are relative to an O_NOFOLLOW directory chain with an \
  inode re-check, and the project is re-proved unused right before each removal. protected.toml also matches \
  project PATHS (homarr, tunarr, immich, kometa, claude, comfyui ...), so most of the 103 folders are skipped \
  for that reason; the result lists the biggest kept folders with the reason. The routine's canary caps the \
  first apply run at 10 percent."""
