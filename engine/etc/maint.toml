attached_min_age_min = 180    # a scan someone may be waiting for is only listed (no page) after this
min_read_kib_s = 256
sample_s = 4

[tasks.swap_audit]
sample_s = 3
cold_refault_pps = 5.0
active_in_mib_s = 1.0
thrash_in_mib_s = 16.0
thrash_total_mib_s = 64.0
thrash_psi_full = 3.0
full_pct = 90.0
min_free_swap_pct = 5.0
scarce_ram_pct = 20.0
relief_min_used_gib = 1.0
relief_headroom_gib = 16.0
relief_cap_margin = 0.9
relief_disk_busy_pct = 40.0
relief_psi_full = 1.0

[tasks.swap_auto_relief]
