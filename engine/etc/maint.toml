# ------------------------------------------------------------------ C0: checks added by the umbrella build (read-only)
# An empty table only documents that the task exists; options go in it. `enabled = false` switches a task off.
[tasks.os_jobs]                  # the OS's own timers (apt-daily, logrotate, fstrim, snapd refresh ...) ran and succeeded recently
# ignore = []   extra_jobs = [{ name = "x", timer = "x.timer", service = "x.service", max_age_hours = 36 }]

[tasks.docker_prune_parity]      # weekly: do docker_cache + docker_images + docker_containers_prune cover docker-prune.sh? (the cutover gate)

[tasks.legacy_audit]             # weekly, info only: a timer, cron line or /etc/cron.* file that no item of legacy-retirement.toml accounts for

[tasks.docker_prune_exposure]    # PAGES while docker-prune.timer would still delete something the native tasks keep (the stopped comfyui container)
crit_within_h = 72               # crit when that timer fires within this many hours (or its next run is unknown), else warn
imminent_h = 6                   # one more page when it gets this close

[tasks.surrealdb_health]         # port of notebook-db-alert.sh: WAL size, disk space, leading indicators
signature_alerts = true          # page again when the SET of failing checks changes at the same level
first_sight_page = true          # page at the first run that sees a problem (the script did), not after alert_confirm_runs
# optional, the defaults reproduce the script: container, data_dir, wal_max_mb = 1024, db_max_gb = 25, disk_min_gb = 40, restart_gt = 3

[tasks.probes]                   # the monitoring plane (etc/probes.toml); the one-minute engine is the tick job `probes-run`
alert_mode = "task"              # "task": the check tier pages on the task level. "events": per-probe pages (needs the cli.py self_notifies edit)
# budget_s, workers, force: see homelab_maint/tasks/monitors.py

[tasks.self_health]              # the monitoring pipeline itself: runner -> publish -> website, tick, live, ring, registry, ack inbox, website, Kuma
# every key optional (homelab_maint/tasks/self_health.py): check_interval_s = 900, web_port = 8098, web_container = "maintenance-web",
# web_check = true, kuma_keys = ["tier-check", "umbrella-probes"], kuma_required = false, registry_check_generated = true,
# refresh_s = 60, stale_factor = 3, stale_down_factor = 10, outbox_warn_s, breaker_fail_n, kuma_fail_n
# public/self.json is rewritten every minute by homelab-maint-selfhealth.timer (NOT the tick: it is the dead-man of the tick)

[tasks.pressure_state]           # the spike ladder's level 0-5 per resource (thresholds, hysteresis: classes.toml [ladder])
[tasks.bulkhead_check]           # weekly, info only: concurrency settings that drifted from the agreed values (Ollama, ComfyUI, Plex ...)

[tasks.report_daily]             # reports (C0: they only write STATE_DIR/public/reports/)
