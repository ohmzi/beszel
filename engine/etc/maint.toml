keep = 60                        # entries kept in the shared index; give report_weekly the same value
ignore_tasks = []                # checks left out of the health score

[tasks.report_weekly]
keep = 60
ignore_tasks = []

# The routine's built-in steps (homelab_maint/routine.py). All C0 except routine_rotate, which is report-only until switched on.
# Their options live in etc/routine.toml [steps.*]; a key set here wins.
[tasks.routine_spike_review]
[tasks.routine_verify_daily]
[tasks.routine_capacity]
[tasks.routine_smart_selftest]
[tasks.routine_updates]
[tasks.routine_image_updates]
[tasks.routine_backup_verify]
[tasks.routine_verify_weekly]
[tasks.routine_restore_check]
[tasks.routine_expiry]
[tasks.routine_trends]
[tasks.routine_verify_monthly]

[tasks.routine_rotate]           # monthly: archive old audit / changes / spike records
mode = "report"

# ------------------------------------------------------------------ the spike manager (tasks/pressure.py; classes, budgets, ladder: classes.toml)
# The one rung that ships ON: unloading idle Ollama models / freeing idle ComfyUI VRAM. Non-destructive, only at memory or GPU pressure
# level 2+, budgeted per day, audited. Slowing, restarting and stopping containers are report-only until you flip them. The check
# service passes --apply so this can act; PAUSE (or `homelab-maint pause pressure_response`) stops every rung and puts back any
# cpu-shares throttle or emergency-stopped container the ladder applied.
[tasks.pressure_response]
mode = "apply"                   # MASTER switch (shows "apply" on the dashboard); "report" forces every rung to report-only
reclaim = "apply"                # L2: unload idle models, free idle VRAM
throttle = "report"              # L3: lower cpu-shares of P2/P3 batch containers (L3-L5 stay report-only until you set them to "apply")
restart = "report"               # L4: restart ONE proven-stuck P2/P3 container (2 per 6 h, backoff)
emergency = "report"             # L5: stop containers from classes.toml emergency_stop (empty by default), one per run

# ------------------------------------------------------------------ C1: safe clean (daily 07:30-09:30) -- REPORT ONLY
[tasks.docker_cache]
mode = "report"
high_gib = 15
low_gib = 8
max_gib_per_run = 30

[tasks.docker_images]
mode = "report"
unused_days = 14
max_items_per_run = 12
max_gib_per_run = 15

[tasks.apt_clean]
mode = "report"

[tasks.apt_cache]                # `apt-get clean` again, with a size floor and a measured freed figure: the ALTERNATIVE to apt_clean
mode = "report"                  # ships OFF so the pair never both run: to use it set enabled = true here and enabled = false on apt_clean
enabled = false
min_mib = 10

[tasks.stale_driver_packages]    # purge apt packages of NVIDIA driver branches other than the loaded one (one apt run; many proofs)
mode = "report"
max_gib_per_run = 10
# keep_branches = ["535"]        # driver branches that are never purged (the LOADED branch is always kept)

[tasks.apt_autoremove_unused]    # purge `apt autoremove` candidates that are shared libraries/plugins no process uses (allow-list policy)
mode = "report"
keep = ["tree", "inxi"]          # owner keep-list: package names or fnmatch globs that are never purged
max_candidates = 80              # candidates examined per run (each costs one apt-get -s)
max_gib_per_run = 5
# never = ["libfoo*"]            # extra never-purge globs (kernels, nvidia, dkms, grub, shim, initramfs, systemd, libc6, docker, qemu ... are built in)
# allow_purge = ["libgl1-amber-dri"]   # waives only the "ships only shared libraries" file-class check for these; the in-use proof still applies

[tasks.snap_revisions]
mode = "report"
retain = 2

[tasks.retention]
mode = "report"
rules = [
  { name = "kavita-logs",    path = "/volume1/docker/kavita/config/logs",    glob = "kavita*.log", max_age_days = 3 },
  { name = "kavita-backups", path = "/volume1/docker/kavita/config/backups", glob = "*.zip", keep_newest = 3 },
]                                # the Tunarr subtitle cache is app_cache_trim's now, the crash dumps crash_dumps': one cleaner per file set
allowed_roots = ["/volume1/docker/kavita/config", "/var/log"]

[tasks.trash]
mode = "report"
max_age_days = 30
users = ["ohmz"]

[tasks.gradle_reaper]
mode = "report"
idle_minutes = 120
min_samples = 2               # consecutive daily samples, >= idle_minutes apart, with no CPU progress

# ---- cleaners-v2, daily (tasks/cleaners_apps.py, cleaners_dev.py): the places that were cleaned by hand once and must not fill up again.
# All report-only; each task is enabled on its own once its report has been read. Suggested order: dangling_images, crash_dumps,
# log_compress, tool_caches, then app_cache_trim last (read its first run's container health line). The root-needing ones refuse
# to apply without root (the daily service is root; a manual run as ohmz only reports).
[tasks.app_cache_trim]           # generalised cache trimmer: rules {name, path, max_age_days, container, health_url ...}, health-checked
mode = "report"
# a rule path must be a STRICT descendant of an allowed root; the code's never-touch list then limits both roots to their cache dirs
allowed_roots = ["/home/ohmz/StudioProjects/tunarr/.docker-data/tunarr/cache", "/volume1/docker/kavita/config"]
# anchored on the canonical path (the code refuses any . or ..): a disposable cache inside the protected tunarr app dir, for THIS task only
unprotect = ["^/home/ohmz/StudioProjects/tunarr/\\.docker-data/tunarr/cache/subtitles(/|$)"]
max_gib_per_run = 15
max_items_per_run = 100          # one item = ONE batch of up to batch_files files (a 131k-file cache is ~60 items)
batch_files = 2000
canary_files = 200               # the first batch of a rule with a container is a canary: settle, probe, then the bulk
check_every = 5                  # re-check the container every N applied batches (and every check_s seconds), and once after the rule
check_s = 10
settle_s = 5
warn_after_runs = 2              # a rule refused/skipped this many runs in a row (or stalled 3x) makes the task warn
manifest_keep_days = 30          # every unlinked file is listed in STATE_DIR/manifests/app_cache_trim.<ts>.jsonl
# Tunarr has no Docker HEALTHCHECK, so health = container running + the app answering health_url (liveness only; mitigated by the canary).
rules = [
  { name = "tunarr-subtitles", path = "/home/ohmz/StudioProjects/tunarr/.docker-data/tunarr/cache/subtitles", max_age_days = 30, root_owned_ok = true, container = "tunarr-host-net", health_url = "http://127.0.0.1:8000/" },
  # second example (verified read-only; never files_only = false on an app dir without need):
  # { name = "kavita-cache", path = "/volume1/docker/kavita/config/cache", max_age_days = 14, container = "kavita", health_url = "http://127.0.0.1:5000/api/health" },
]

[tasks.log_compress]             # gzip rotated logs over min_mib (gzip -t, length check, never a file a process has open or logrotate is rotating)
mode = "report"
roots = ["/var/log"]             # canonical paths only (no `..`, no trailing slash)
min_mib = 50
min_age_days = 1
max_depth = 2
exclude_dirs = ["journal"]
max_gib_per_run = 5

[tasks.dangling_images]          # untagged images, unreferenced by any container (running or exited), older than min_age_hours; one `docker image rm ID` each
mode = "report"                  # (dangling only: tagged unused images stay docker_images' job, 14 days). Needs a fresh image ledger: no ledger, nothing selected
min_age_hours = 24
ledger_max_age_hours = 48
local_build_days = 7             # an image with no registry digest (a local build) waits this long: it cannot be pulled back
max_items_per_run = 20
max_gib_per_run = 15

[tasks.crash_dumps]              # apport *.crash older than 2 days, systemd-coredump files older than 7 days (inside the two directories only)
mode = "report"
crash_dir = "/var/crash"
crash_max_age_days = 2
coredump_dir = "/var/lib/systemd/coredump"
coredump_max_age_days = 7

[tasks.tool_caches]              # regenerable developer caches (npm, pip, uv, pnpm store, thumbnails, Gradle daemon logs, browser caches)
mode = "report"
user = "ohmz"                    # npm/pip/uv/pnpm run as this user (runuser when root)
min_mib = 64                     # a cache smaller than this is left alone (npm, pip, uv; pnpm: files nothing links to)
thumbs_days = 30                 # ~/.cache/thumbnails/*/*.png older than this, by mtime (atime is reset by readers)
gradle_log_days = 14             # ~/.gradle/daemon/*/daemon-<pid>.out.log whose daemon is gone (never ~/.gradle/caches)
browser_days = 7                 # browser cache files, only while that browser is not running (never profiles)
long_lived_min = 30              # npx/pnpx/uvx/`uv run` older than this no longer pin a cache (an install always does)
projects_root = "/home/ohmz/StudioProjects"   # package.json packageManager fields name the pnpm version (never an unpinned download)
max_gib_per_run = 10
# off switches: npm pip uv pnpm thumbnails gradle_logs browsers (e.g. pnpm = false)

[tasks.caps]
mode = "report"
ceilings = { "tunarr-host-net" = 40, "kavita" = 20, "sabnzbd" = 32, "omnivoice-studio-gpu" = 16, "comfyui" = 48 }
swap_extra_ratio = 0.25
unprotect = ["^tunarr-host-net$", "^kavita$", "^sabnzbd$", "^omnivoice-studio-gpu$", "^comfyui$"]  # a memory ceiling is not a kill

[tasks.qos_classes]              # baseline cpu-shares per service class (classes.toml), idempotent `docker update`
mode = "report"

[tasks.openwebui_media_prune]    # port of prune-openwebui-media.sh (allow-listed generated media, 7 days)
