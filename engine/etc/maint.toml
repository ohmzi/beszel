# homelab-maint main configuration.
#
# SHIPPED STATE: EVERY CLEANER (C1) IS mode = "report" (it computes and shows what it WOULD remove, but removes nothing),
# the same for every port of a legacy script (comfyui_idle_reclaim, immich_recycle, openwebui_media_prune, docker_containers_prune)
# and for the spike ladder's throttle / restart / emergency rungs. Turning cleanup on is the OWNER's decision, one task at a time.
# The only things that ship on: the spike ladder's non-destructive reclaim rung (unload idle models at pressure level 2+, SPEC3) and the
# read-only checks.
# To enable a cleaner: set its `mode = "apply"` below. A task only mutates when BOTH its mode is
# "apply" AND the run was started with --apply (the check, daily and weekly systemd services and the routine tick all pass it).
# `unprotect = [regex, ...]` on a task exempts those names from the global protected.toml patterns
# for that task only (e.g. `caps` exists to bound tunarr, which the global list protects from kills).
# C0 tasks never mutate. C2 tasks only produce plans; apply with `homelab-maint approve TASK HASH`.
# Kill switch: `homelab-maint pause [TASK]` (PAUSE / PAUSE.TASK in /etc/homelab-maint).
#
# Install-if-absent: an upgrade never rewrites this file. install.sh saves the shipped copy as maint.toml.dist and lists the
# [tasks.X] tables your copy lacks; merge them by hand (a missing table means defaults: mode "report", except pressure_response).

[global]
bridge = "/usr/local/sbin/backup-notify-hermes.py"   # existing Hermes SMS+email bridge (run via runuser); notify.toml inherits it
notify_handle = "ohmz"                               # likewise: the one source of truth for who gets the messages
kuma_url = "http://127.0.0.1:3011"
www_port = 9111
alert_confirm_runs = 2        # a problem must persist this many runs before it pages
alert_reminder_hours = 24
alert_daily_budget = 8        # hard cap on pages per rolling 24 h (core.Notifier); notify.toml [budget.per_day] alert = 8 is the same cap in the new path

[caps]                        # per task, per run; override in [tasks.X] with max_gib_per_run / max_items_per_run
max_gib_per_run = 40
max_items_per_run = 500

