mode = "report"               # the owner switches it on (apply); it never kills anything, it only runs swapoff + swapon behind every gate
trigger_pct = 80.0
release_pct = 60.0
persist_hours = 2.0
min_cold_share = 0.7
cold_refault_pps = 5.0
min_interval_hours = 12.0
refill_hours = 6.0
breaker_after_refills = 2.0
