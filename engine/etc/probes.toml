# =====================================================================================================================
# 6. Containers. The fleet probe judges EVERY container's state and Docker healthcheck in one row (details name the offenders);
#    per-container probes below give the stateful stores and key apps their own availability history.
#    Stopped by design: comfyui (expected_stopped_containers in maint.toml), the throw-away maintenance-web-test-N containers.
# =====================================================================================================================
[[probe]]
name = "ct-fleet"
title = "All containers running and healthy"
type = "docker"
target = "*"
class = "P2"
group = "Containers"
interval_s = 120
tags = ["containers"]
expect = { except = ['^comfyui$', '^maintenance-web-test-\d+$'] }
kuma_push_key = "containers"

[[group]]
group = "Containers"
type = "docker"
class = "P1"
interval_s = 120
tags = ["containers", "db"]
