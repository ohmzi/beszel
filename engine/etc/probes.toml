# =====================================================================================================================
# 7. Hermes (the agent harness, an app): its liveness comes from its OWN state files, never by importing Hermes.
#    stack_watchdog.py and search_canary.py keep running (as scheduler jobs, S8) and keep writing ~/.hermes/*_state.json in
#    health_alert's v2 format; each of their checks is mirrored here as a probe so it shows up in the inventory, the SLOs and the
#    incident ledger with availability history. While those scripts still text/email on their own the mirrors are severity=info
#    (never page, so nothing is sent twice); at the cutover of stack-watchdog / search-canary (see legacy-retirement.toml) flip
#    the two `severity = "info"` lines below to "warn" and stop the legacy notification. The meta probes (is the watchdog itself
#    still running? is the ticker beating?) page as warn now: nothing else watches them.
# =====================================================================================================================
[[group]]
group = "Hermes"
source = "hermes"
class = "P1"
slo = 99.0
interval_s = 120
tags = ["hermes"]
probes = [
  { name = "hermes-api", title = "Hermes API (:8642)", type = "http", target = "http://127.0.0.1:8642/health", expect = { json = [{ path = "status", equals = "ok" }] } },
  { name = "hermes-gateway", title = "Hermes gateway state", type = "json", target = "/home/ohmz/.hermes/gateway_state.json", expect = { json = [{ path = "gateway_state", equals = "running" }, { path = "updated_at", age_max_s = 300, age_warn_s = 180 }] } },
  # ticker_heartbeat / ticker_last_success hold one float epoch (written every 60 s); the watchdog's own limit is 300 s.
  { name = "hermes-ticker", title = "Hermes cron ticker beating", type = "file_age", target = "/home/ohmz/.hermes/cron/ticker_heartbeat", expect = { max_age_s = 300, warn_age_s = 180, epoch_content = true } },
  { name = "hermes-ticker-ok", title = "Hermes cron ticker succeeding", type = "file_age", target = "/home/ohmz/.hermes/cron/ticker_last_success", expect = { max_age_s = 300, warn_age_s = 180, epoch_content = true } },
  { name = "hermes-flightclaw", title = "Flightclaw MCP (:8765)", type = "http", target = "http://127.0.0.1:8765/mcp", interval_s = 300, class = "P2", expect = { status = [200, 406] } },   # a bare GET gets 406 from a live MCP server
  { name = "hermes-watchdog-alive", title = "stack-watchdog still running", type = "json", target = "/home/ohmz/.hermes/watchdog_state.json", kuma_push_key = "hermes-watchdog", expect = { max_age_s = 1200, json = [{ path = "run.last_run_at", age_max_s = 1200, age_warn_s = 600 }, { path = "run.killed_streak", max = 1 }] } },
  { name = "hermes-canary-alive", title = "search-canary still running", type = "json", target = "/home/ohmz/.hermes/search_canary_state.json", interval_s = 600, expect = { max_age_s = 5400, json = [{ path = "run.last_run_at", age_max_s = 5400, age_warn_s = 3600 }, { path = "run.killed_streak", max = 1 }] } },
]

# Mirrors of the watchdog's 11 checks (key = the checks.<key> in watchdog_state.json; label/detail are Hermes's own words).
[[group]]
group = "Hermes watchdog"
source = "hermes"
type = "json"
class = "P2"
severity = "info"
interval_s = 300
tags = ["hermes", "mirror"]
expect = { max_age_s = 1200 }
probes = [
  { name = "hermes-wd-gateway", title = "Hermes gateway (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.gateway.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.gateway.last_detail" } },
  { name = "hermes-wd-api", title = "Hermes API (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.api.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.api.last_detail" } },
  { name = "hermes-wd-delivery", title = "Delivery timer (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.delivery.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.delivery.last_detail" } },
  { name = "hermes-wd-backup", title = "Stack backup freshness (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.backup.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.backup.last_detail" } },
  { name = "hermes-wd-flightclaw", title = "Flightclaw (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.flightclaw.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.flightclaw.last_detail" } },
  { name = "hermes-wd-pubgate", title = "Public gate (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.pubgate.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.pubgate.last_detail" } },
  { name = "hermes-wd-pubquota", title = "Guest quota (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.pubquota.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.pubquota.last_detail" } },
  { name = "hermes-wd-ticker", title = "Cron ticker (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.ticker.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.ticker.last_detail" } },
  { name = "hermes-wd-gwrestarts", title = "Gateway restarts (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.gwrestarts.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.gwrestarts.last_detail" } },
  { name = "hermes-wd-backlog", title = "Delivery backlog (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.backlog.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.backlog.last_detail" } },
  { name = "hermes-wd-version", title = "Hermes version pin (watchdog)", target = "/home/ohmz/.hermes/watchdog_state.json", expect = { json = [{ path = "checks.hermesver.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.hermesver.last_detail" } },
]

[[group]]
group = "Hermes watchdog"
source = "hermes"
type = "json"
class = "P2"
severity = "info"
interval_s = 600
tags = ["hermes", "mirror", "search"]
expect = { max_age_s = 5400 }
probes = [
  { name = "hermes-sc-chat", title = "Web search, chat (canary)", target = "/home/ohmz/.hermes/search_canary_state.json", expect = { json = [{ path = "checks.search_chat.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.search_chat.last_detail" } },
  { name = "hermes-sc-agent", title = "Web search, agent jobs (canary)", target = "/home/ohmz/.hermes/search_canary_state.json", expect = { json = [{ path = "checks.search_hermes.status", in = ["ok"], warn_in = ["degraded"] }], detail_path = "checks.search_hermes.last_detail" } },
]

# =====================================================================================================================
# 8. Public reachability (end to end through the Cloudflare tunnel). external = true is the ONLY way a probe may leave the
#    host; GET only, nothing sent. seerr.ohmzhomelab.ca answered 200 on 2026-10-02. The maintenance hostname is added in the
#    Cloudflare dashboard by the owner (web/README.md), so it is optional until it has been seen up once; when Cloudflare
#    Access fronts it, an unauthenticated GET gets the Access login (302/401/403), which still proves tunnel + DNS.
# =====================================================================================================================
[[group]]
group = "Public"
type = "http"
external = true
class = "P1"
interval_s = 300
tags = ["public"]
probes = [
  { name = "public-seerr", title = "Public hostname: Seerr", target = "https://seerr.ohmzhomelab.ca/" },
  { name = "public-maintenance", title = "Public hostname: maintenance site", target = "https://maintenance.ohmzhomelab.ca/healthz", optional = true, expect = { status = ["200-299", "300-399", 401, 403] } },
]
