verified_runs = 2
require_idle = ["stack-backup.service"]
parity_check = [
  { kind = "scheduled", job = "stack-backup" },
  { kind = "unit_equiv", job = "stack-backup", unit = "stack-backup.service", scope = "user:ohmz" },
  { kind = "job_attr", job = "stack-backup", attr = "pausable", equals = false },
  { kind = "file_age", path = "/media/SandiskSSD/ai-stack-backups/LAST_OK", max_age_s = 93600 },
  { kind = "notify", kinds = ["test"], max_age_days = 30 },
]
retire_actions = [
  { do = "disable", unit = "stack-backup.timer" },
]
owner_notes = """
Cutover only when LAST_OK is fresh (< 26 h) and no backup is running (refused otherwise). The job needs TimeoutStartSec=30min, Nice=10 and
idle IO like the old unit. The unit's OnFailure=stack-alert@ line stays (harmless; it only fires for manual `systemctl --user start`).
The stack-watchdog 'backup' check keeps reading LAST_OK, so it keeps alarming if the umbrella job ever stops.
"""

[[item]]
name = "tier-check"
title = "homelab-maint check tier: stays on its own systemd timer, deliberately (the tick's watchdog)"
kind = "timer"
location = "homelab-maint-check.timer -> homelab-maint-check.service (homelab-maint run --tier check --apply, every 15 min)"
mode = "keep"
wave = 4
schedule = "every 15 min, up to 60 s random delay"
keeps_job = "tier-check"
parity_check = [
  { kind = "scheduler_health" },
  { kind = "scheduler_validate" },
  { kind = "command", argv = ["systemctl", "is-enabled", "homelab-maint-check.timer"], regex = "^enabled" },
  { kind = "probe", names = ["umbrella-tick"] },
  { kind = "notify", kinds = ["test"], max_age_days = 30 },
]
owner_notes = """
NEVER retired (validation refuses to disable homelab-maint-check.timer). After wave 4 the stack watchdog, the stack backup, the daily/weekly
runners and both system backups all start from ONE process, the tick, and its probes-run job lives there too. The check tier is the only
runner that does not: its `probes` task folds the engine in every 15 minutes and judges the probe umbrella-tick (tick.json older than 5
minutes = crit, paged through core.Notifier), and backup_freshness, os_jobs and alert_path_health run there. That is what notices a dead
tick. Kuma's umbrella-probes push is only a second view: Kuma has ZERO notification channels, so it pages nobody.
The jobs.toml job `tier-check` therefore stays in observe mode for good (its legacy driver, this timer, stays the driver); the cutover of this
item only RECORDS the adoption once the tick is proven beating and jobs.toml validates, and everything the tick takes over depends on it.
A jobs.toml typo is the other way the tick silences itself: the tick still beats, but schedules nothing. `scheduler validate` is therefore a
parity check of every adapter that hands a job over and of this item. (Not done by this tool, a request to the scheduler: report crit and
make the tick service exit non-zero when it loaded no jobs because of config problems, and keep a last-known-good jobs.toml.)
"""

[[item]]
name = "tier-daily"
title = "homelab-maint daily tier (runner timer, replaced by the tick)"
kind = "timer"
location = "homelab-maint-daily.timer -> homelab-maint-daily.service (homelab-maint run --tier daily --apply)"
mode = "adapter"
wave = 4
schedule = "daily 07:30, up to 20 min random delay, Persistent"
replaced_by = "tier-daily"
via = "job"
job = "tier-daily"
depends_on = ["stack-watchdog"]
soak_days = 7
require_idle = ["homelab-maint-daily.service"]
parity_check = [
  { kind = "scheduler_health" },
  { kind = "scheduled", job = "tier-daily" },
]
retire_actions = [
  { do = "disable", unit = "homelab-maint-daily.timer" },
]
owner_notes = "The routine engine still decides WHAT the daily tier may do inside its window; only WHO starts it changes. Wait for the next 07:30 and read the daily digest."

[[item]]
name = "tier-weekly"
title = "homelab-maint weekly tier (runner timer, replaced by the tick)"
kind = "timer"
location = "homelab-maint-weekly.timer -> homelab-maint-weekly.service (homelab-maint run --tier weekly --apply)"
mode = "adapter"
wave = 4
schedule = "Wed 07:45, Persistent"
replaced_by = "tier-weekly"
via = "job"
