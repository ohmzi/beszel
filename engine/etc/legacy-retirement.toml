owner_notes = """
/etc/cron.daily/apport deletes crash reports older than 7 days from /var/crash. The `retention` rule `crash-dumps` in maint.toml does the
same for files, so either may act first; both are safe. Leave apport's script alone (package-owned) and keep the umbrella rule in report
mode unless you want the umbrella to be the only janitor.
"""

