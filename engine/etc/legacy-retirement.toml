[[item]]
name = "metrics-sample"
title = "7-day metrics ring sampler (runner timer, replaced by the tick)"
kind = "timer"
location = "homelab-maint-metrics.timer -> homelab-maint-metrics.service (python3 -m homelab_maint.metrics_ring sample)"
mode = "adapter"
wave = 4
schedule = "every minute (OnUnitActiveSec=1min)"
replaced_by = "metrics-sample"
via = "job"
job = "metrics-sample"
depends_on = ["stack-watchdog"]
require_idle = ["homelab-maint-metrics.service"]
parity_check = [
  { kind = "scheduler_health" },
  { kind = "scheduled", job = "metrics-sample" },
  { kind = "file_age", path = "/var/lib/homelab-maint/metrics-ring.json", max_age_s = 300 },
]
retire_actions = [
  { do = "disable", unit = "homelab-maint-metrics.timer" },
]
owner_notes = "A one-minute job: the tick costs tens of ms when nothing is due, and a missed minute is simply skipped. Watch the ring file stay fresh."

# =====================================================================================================================
# WAVE 5: system backups. Last, and slowly: each has a 14 day soak (two weekly cycles) before anything depends on it.
# =====================================================================================================================
[[item]]
name = "backup-system"
title = "backup-system (weekly system-drive backup to BK-SYSTEM)"
kind = "timer"
location = "backup-system.timer -> /usr/local/sbin/backup-system.sh (sources backup-common.sh; status /var/log/backup/system-status.json; OnFailure=backup-failure@%n)"
mode = "adapter"
wave = 5
schedule = "Sat 01:00, up to 15 min random delay, Persistent"
replaced_by = "backup-system"
via = "job"
job = "backup-system"
depends_on = ["stack-backup", "tier-daily", "notify-route"]
soak_days = 14
verified_runs = 2
backup = true
require_idle = ["backup-system.service"]
parity_check = [
  { kind = "scheduled", job = "backup-system" },
  # No live proof run can exist before the cutover (the legacy-timer interlock forbids it), so prove the job is the unit: same command, user,
  # nice, ionice, timeout (none), RequiresMountsFor and environment as `systemctl show backup-system.service`.
  { kind = "unit_equiv", job = "backup-system", unit = "backup-system.service" },
  # The global kill switch (touch PAUSE) must not silently stop the backup: a pausable job is deferred and finally expired.
  { kind = "job_attr", job = "backup-system", attr = "pausable", equals = false },
  { kind = "status_json", path = "/var/log/backup/system-status.json", result_key = "result", ok_values = ["ok"], max_age_hours = 200 },
  { kind = "notify", kinds = ["test"], max_age_days = 30 },
]
retire_actions = [
  { do = "disable", unit = "backup-system.timer" },
]
owner_notes = """
The script, backup-common.sh and the status JSON are unchanged; only WHO starts it changes (the umbrella: gated, serialised with the other
backup, timeout infinity, Nice=10 best-effort IO 7, as in the old unit). Cut over on a Sunday-to-Friday, never while a backup runs (refused:
the unit, the tick's own run of the job, or a held /run/lock/backup-*.lock; --force cannot override that).
The job is marked self_notifies = true: you keep getting the script's own report through backup-notify.sh until the wave 6 item
backup-notify-wrapper turns that off. REQUIRED right after the cutover: start the first run attended, `homelab-maint job run backup-system`,
and compare its status JSON with the previous one. Nothing that depends on this item counts until the tick has recorded 2 green runs of the
job, and the 14 day soak starts at the first of them: calendar time with a backup the tick never launched (a pressure deferral, a bad mount, a
jobs.toml the tick ignores) proves nothing, and is how the weekly backup could stop with nothing but the next backup_freshness warning to say so.
"""

[[item]]
name = "backup-immich"
title = "backup-immich (weekly Immich library backup to BK-IMMICH)"
kind = "timer"
location = "backup-immich.timer -> /usr/local/sbin/backup-immich.sh (status /var/log/backup/immich-status.json; OnFailure=backup-failure@%n)"
mode = "adapter"
wave = 5
schedule = "Sun 01:00, up to 15 min random delay, Persistent"
replaced_by = "backup-immich"
via = "job"
job = "backup-immich"
depends_on = ["backup-system"]
soak_days = 14
verified_runs = 2
backup = true
require_idle = ["backup-immich.service"]
parity_check = [
  { kind = "scheduled", job = "backup-immich" },
  { kind = "unit_equiv", job = "backup-immich", unit = "backup-immich.service" },
  { kind = "job_attr", job = "backup-immich", attr = "pausable", equals = false },
  { kind = "status_json", path = "/var/log/backup/immich-status.json", result_key = "result", ok_values = ["ok"], max_age_hours = 200 },
  { kind = "notify", kinds = ["test"], max_age_days = 30 },
]
retire_actions = [
  { do = "disable", unit = "backup-immich.timer" },
]
owner_notes = "Same mechanics as backup-system (including the attended first run: `homelab-maint job run backup-immich`); starts only after the tick has recorded 2 green backup-system runs and 14 days have passed since the first, so a regression is isolated to one disk."

# =====================================================================================================================
# WAVE 6: backup wrappers (the legacy notification and failure path around the two backups). Order matters: first make the umbrella
# the only notifier (self_notifies = false), THEN retire the script's own notifier, THEN the failure hook.
# =====================================================================================================================
[[item]]
name = "backup-notify-wrapper"
title = "backup-notify.sh (per-backup SMS + email through the Hermes bridge)"
kind = "script"
location = "/usr/local/sbin/backup-notify.sh (0750; config /etc/backup/notify.conf 0600; log /var/log/backup/notify.log); called by backup-common.sh and backup-failed.sh"
mode = "retire"
wave = 6
schedule = "event driven (end of each backup run)"
replaced_by = "notify"
via = "route"
depends_on = ["backup-system", "backup-immich"]
require_idle = ["backup-system.service", "backup-immich.service"]
require_idle_jobs = ["backup-system", "backup-immich"]
backup = true
parity_check = [
  # you edit /etc/homelab-maint/jobs.toml by hand for self_notifies: a typo there silences every job, so it must still validate cleanly
  { kind = "scheduler_validate", jobs = ["backup-system", "backup-immich"] },
  { kind = "job_attr", job = "backup-system", attr = "self_notifies", equals = false },
  { kind = "job_attr", job = "backup-immich", attr = "self_notifies", equals = false },
  { kind = "job_attr", job = "backup-system", attr = "notify.on_failure", equals = "alert" },
  { kind = "job_attr", job = "backup-immich", attr = "notify.on_failure", equals = "alert" },
  { kind = "notify", kinds = ["maintenance", "alert", "test"], max_age_days = 14 },
  { kind = "task", name = "backup_freshness", green = 3, min_hours = 48, fresh_h = 2 },
]
retire_actions = [
  { do = "move", src = "/usr/local/sbin/backup-notify.sh" },
]
owner_notes = """
THE interlock of the whole migration: while a job has self_notifies = true the umbrella stays silent about ordinary failures (the script
alerts for itself). Moving backup-notify.sh without flipping that flag would make a failed backup SILENT. So the parity checks above
read the EFFECTIVE jobs.toml: set `self_notifies = false` for backup-system and backup-immich in /etc/homelab-maint/jobs.toml first, then
run `homelab-maint scheduler validate` (a typo in that file makes the tick schedule NOTHING; the scheduler_validate check refuses the cutover).
After cutover backup-common.sh finds no executable backup-notify.sh and skips it quietly; the umbrella job tells you instead (email
after each backup, text only for a failure). You stop getting the 'backup OK' text. Never move backup-notify-hermes.py or
backup_report_html.py: notify.py imports them. /etc/backup/notify.conf is left in place.
"""

[[item]]
name = "backup-failure-hook"
title = "backup-failure@.service OnFailure hook (backup-failed.sh)"
kind = "hook"
location = "/etc/systemd/system/backup-failure@.service -> /usr/local/sbin/backup-failed.sh (writes /var/log/backup/FAILED-<unit>.txt, then backup-notify.sh); also run by the jobs' hooks.on_failure"
mode = "retire"
wave = 6
schedule = "event driven (a backup unit fails; or a backup job fails under the tick)"
replaced_by = ["backup-system", "backup-immich"]
via = "job"
depends_on = ["backup-notify-wrapper", "backup-system", "backup-immich"]
require_idle = ["backup-system.service", "backup-immich.service"]
require_idle_jobs = ["backup-system", "backup-immich"]
backup = true
parity_check = [
  { kind = "scheduler_validate", jobs = ["backup-system", "backup-immich"] },
  { kind = "job_attr", job = "backup-system", attr = "self_notifies", equals = false },
  { kind = "job_attr", job = "backup-immich", attr = "self_notifies", equals = false },
  { kind = "task", name = "backup_freshness", green = 3, min_hours = 48, fresh_h = 2 },
]
retire_actions = [
  { do = "move", src = "/usr/local/sbin/backup-failed.sh" },
  { do = "stub", path = "/usr/local/sbin/backup-failed.sh", mode = "0755", content = """#!/bin/sh
# homelab-maint forwarding stub (the retired backup-failed.sh). Scheduled backups are run and reported by the umbrella job scheduler,
# which alerts on a failed or lost run itself; this only leaves a journal line when this hook is still called (jobs.toml
# hooks.on_failure, or somebody started a backup unit by hand and it died).
echo "BACKUP FAILURE: ${1:-unknown} (scheduled runs are reported by homelab-maint)" | systemd-cat -t backup -p err
exit 0
""" },
]
owner_notes = """
The stub keeps `hooks.on_failure = ["/usr/local/sbin/backup-failed.sh", ...]` in jobs.toml valid; remove those two lines at leisure.
The OnFailure= lines in backup-system.service and backup-immich.service and the backup-failure@.service template stay (inert). The old
FAILED-*.txt marker files are never read by backup_freshness (they persist forever).
"""
