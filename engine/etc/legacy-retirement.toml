# homelab-maint: legacy retirement inventory (SPEC4 S11). Read by homelab_maint/legacy.py (`homelab-maint migrate ...`).
#
# One [[item]] per legacy scheduled thing or hook on this host. Built from a READ-ONLY inventory taken 2026-10-02 of:
# `systemctl list-unit-files|list-timers` for system AND user (ohmz), /etc/systemd/system units and drop-ins, the root and ohmz
# crontabs, /etc/crontab, /etc/cron.*, anacron, /usr/local/sbin, /usr/local/bin, ~/ai-stack/scripts, ~/tunarr-sync,
# ~/sensor-exporter, every OnFailure= in /etc/systemd and ~/.config/systemd/user, /etc/smartd.conf, /etc/udev/rules.d (no RUN=
# hooks except snap interfaces), `docker ps` (Diun, Kometa, nextcloud_cron schedulers), the Uptime Kuma DB COPY (13 monitors plus the
# Media Stack group, ZERO notification channels), and the Hermes cron store (one fare-watch job).
#
# MODES
#   adapter  the umbrella schedules, gates, logs, alerts and reports the proven script; the old timer / cron line is retired,
#            the script stays where it is and becomes the job's command.
#   port     a native task replaces it: timer disabled, script MOVED to <legacy_root>/<item>/ (never deleted).
#   retire   superseded, nothing replaces it (or the replacement is a platform setting): same mechanics as port.
#   observe  OS-managed (apt, logrotate, fstrim, ...): never touched, verified by the os_jobs check.
#   keep     daemon / app plumbing: never touched, probed. Cutover only records the adoption.
#
# FIELDS  name kind(unit|timer|cron|script|hook) location mode wave scope("system"|"user:ohmz") schedule replaced_by(string|list)
#   via(job|task|probe|os_job|route|none) parity_check(table|list; derived from replaced_by+via when omitted)
#   unmonitored("why": observe/keep items nothing can verify; parity is then trivially green) retire_actions(list)
#   depends_on soak_days(days a DEPENDENT must wait after this item is retired; when the item hands a job to the tick the soak counts from the
#   job's FIRST green run recorded by the tick after the cutover) verified_runs(green tick runs a dependent needs: default 1 for an adapter
#   with a job; monitors are quiet in history, so only 1 is provable for them) require_idle(units that must not be running)
#   require_idle_jobs(tick jobs that must not be running) backup(true: also refuse while a /run/lock/backup-*.lock is held; both lists and
#   the item's own job are checked for cutover AND rollback, --force cannot override them)
#   keeps_job("job": a KEEP item whose job stays in observe mode on purpose, its legacy driver stays the driver)
#   job("name in jobs.toml": hand the thing over to the scheduler tick; appends a last {do="job_mode"} action = managed for
#   adapters, retired for ports, and the tick's own interlock then lets it run only once the legacy driver is off; the job must
#   exist in jobs.toml and its `retire` list must name the same driver, a test enforces both)
#   pause_on_rollback(mutating native tasks to PAUSE if the legacy thing comes back, so the two never both act)
#   pre_retired(YYYY-MM-DD: already retired by hand; recorded, and checked for drift) owner_notes.
#   There is no hand-written rollback_actions: rollback is DERIVED from the state recorded before each action, so it restores the
#   exact enablement state / file mode / cron line (see legacy.py). `migrate plan ITEM` and docs/MIGRATION.md print both directions.
# PARITY KINDS  task job probe (green runs over a soak; a probe must also be up NOW with a fresh last_run) | scheduled (the tick lists the job:
#   only that it KNOWS it) | scheduler_health | scheduler_validate (jobs.toml loads and `scheduler validate` is clean for the job: added
#   automatically to every adapter that hands a job over) | unit_equiv (the EFFECTIVE jobs.toml job launches exactly what the legacy service
#   launches, per `systemctl show`: the stand-in for a proof run that cannot exist before the cutover) | job_attr (equals|contains on the
#   EFFECTIVE jobs.toml job) | task_applies (mode = apply AND --apply really reaches it) | status_json file_age (what the LEGACY driver
#   last wrote: a baseline only) config command notify os_job manual none
# OWNER ADDITIONS go in /etc/homelab-maint/legacy-retirement.d/*.toml (extra [[item]] tables, root-owned 0644); this file is part of the release.
# ACTIONS  {do="disable", unit, scope?, now?}  {do="move", src, dst_name?, reload?}  {do="stub", path, content, mode?}
#   {do="cron_comment", user, tag | match}  {do="job_mode", job, mode}  {do="manual", note}   (`{legacy_dir}` in a stub = <legacy_root>/<item>)
#
# WAVES (safe order; docs/MIGRATION.md explains each): 0 observe, 1 monitors, 2 notification hooks, 3 small jobs, 4 the tick's first
# managed jobs (Hermes user jobs, the stack backup, the daily/weekly/metrics runner timers; the CHECK timer stays on purpose), 5 system
# backups, 6 backup wrappers.

[meta]
version = 1
verified = "2026-10-02 (read-only inventory, re-verified against the live host and `migrate audit`; see header)"
legacy_root = "/usr/local/lib/homelab-maint/legacy"

[meta.parity_defaults]
green = 8          # consecutive green runs ...
min_hours = 48     # ... spanning at least this long
fresh_h = 2        # newest run must be this recent (daily/weekly tasks set their own)

[meta.waves]
"0" = "Observe: OS-managed jobs (no host change)"
"1" = "Monitors and always-on daemons (no host change)"
"2" = "Notification hooks"
"3" = "Small jobs and cron lines"
"4" = "The tick takes over: Hermes user jobs, the stack backup, the daily/weekly/metrics runner timers (the check timer stays)"
"5" = "System backups (last: the crown jewels)"
"6" = "Backup wrappers (only after both backups are cut over and soaked)"

