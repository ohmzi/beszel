[[item]]
name = "os-cron-shims"
title = "anacron and /etc/cron.{daily,weekly,monthly} package shims"
kind = "script"
location = "/etc/cron.daily/{0anacron,apport,apt-compat,dpkg,google-chrome,logrotate,man-db,sysstat}, /etc/cron.weekly/{0anacron,man-db}, /etc/cron.monthly/0anacron, anacron.timer"
mode = "observe"
