# =====================================================================================================================
# WAVE 1: monitors and always-on daemons. Nothing here is retired; the umbrella PROBES them (etc/probes.toml).
# =====================================================================================================================
[[item]]
name = "kuma-monitors"
title = "Uptime Kuma monitors (13 plus the Media Stack group, feeding the Homarr uptime widget)"
kind = "hook"
location = "container uptime-kuma :3011 (v1); monitors: Internet, Plex (paused), Radarr, Sonarr, Prowlarr, SABnzbd, Deluge, Transmission, Bazarr, Tautulli, Seerr, Kometa, Immich"
mode = "keep"
wave = 1
schedule = "every 60 s (Internet every 900 s)"
replaced_by = ["internet", "radarr", "sonarr", "prowlarr", "sabnzbd", "deluge", "transmission", "bazarr", "tautulli", "seerr", "ct-kometa", "immich"]
via = "probe"
owner_notes = """
Kuma stays: Homarr's uptimeStatus widget reads it. The umbrella becomes the source of truth: the probes above cover the same targets
(verify with `python3 -m homelab_maint.probes kuma-diff <COPY of the Kuma sqlite>`; never point it at the live DB). Kuma has no
notification channels today, so it pages nobody; the umbrella pages through notify. The Plex monitor is paused in Kuma, so the plex probe
is left out of the parity set. kuma.toml push tokens (optional) let the umbrella heartbeat Kuma push monitors.
"""

[[item]]
name = "platform-daemons"
title = "Platform daemons: docker, cloudflared, tailscaled, fail2ban, smartd, ollama, Plex snap"
kind = "unit"
location = "docker.service, cloudflared.service, tailscaled.service, fail2ban.service, smartmontools.service (alias smartd.service), ollama.service, snap.plexmediaserver.plexmediaserver.service"
mode = "keep"
wave = 1
schedule = "always on"
replaced_by = ["docker-daemon", "svc-cloudflared", "tailscale", "fail2ban", "svc-smartd", "ollama", "svc-plex"]
via = "probe"
owner_notes = "plexmediaserver.service (the apt unit) is masked (-> /dev/null); the snap unit is the live one. cloudflared-update.timer is disabled on purpose (the service runs with --no-autoupdate)."

[[item]]
name = "umbrella-services"
title = "The umbrella's own services: homelab-maint-www (:9111), homelab-maint-live, the tick timer, the self-health timer"
kind = "unit"
location = "homelab-maint-www.service (127.0.0.1:9111, installed), homelab-maint-live.service, homelab-maint-tick.timer and homelab-maint-selfhealth.timer (shipped by install.sh)"
mode = "keep"
wave = 1
schedule = "always on; the tick every minute"
replaced_by = ["umbrella-www", "svc-hm-www", "umbrella-status"]
via = "probe"
owner_notes = """
The platform itself: this tool refuses to disable any of these (a validation rule, not a convention). They are probed so a dead umbrella is
seen by something other than itself: svc-hm-tick / umbrella-probes (Kuma push dead-man's switch) when the tick is installed.
"""

[[item]]
name = "dashboards-and-sensors"
title = "Always-on helpers: glances, sensor-exporter, smart-bridge, thermal-log"
kind = "unit"
location = "glances.service (127.0.0.1:61208), sensor-exporter.service (127.0.0.1:9110, fan supervisor), smart-bridge.service (127.0.0.1:7634), thermal-log.service (CSV every 30 s)"
mode = "keep"
wave = 1
schedule = "always on"
replaced_by = ["glances", "sensor-exporter", "svc-smart-bridge", "svc-thermal-log"]
via = "probe"
parity_check = [
  { kind = "probe", names = ["glances", "sensor-exporter", "svc-smart-bridge", "svc-thermal-log"] },
  { kind = "file_age", path = "/home/ohmz/StudioProjects/sensor-exporter/tuning/logs/thermal.csv", max_age_s = 300 },
]
owner_notes = """
sensor-exporter drives fans (hardware control): it is NEVER retired by this tool. thermal-log.service keeps a 30 s CSV with package
and GPU watts that the 1-minute metrics ring does not carry; retire it only after the ring does.
"""

[[item]]
name = "hermes-stack"
