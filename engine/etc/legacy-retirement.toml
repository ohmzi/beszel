# =====================================================================================================================
# WAVE 2: notification hooks. One path out: notify.py -> the owner's Hermes transports.
# =====================================================================================================================
[[item]]
name = "notify-route"
title = "The one notification path (notify.py over the Hermes SMS + Gmail transports)"
kind = "hook"
location = "~ohmz/.hermes/alert_transports.env via /usr/local/sbin/backup-notify-hermes.py and backup_report_html.py (kept as the umbrella's transport and email palette)"
mode = "keep"
wave = 2
schedule = "event driven"
replaced_by = "notify"
via = "route"
parity_check = [
  { kind = "notify", kinds = ["test"], max_age_days = 30 },
  { kind = "task", name = "alert_path_health", green = 8, min_hours = 48 },
]
owner_notes = """
Prove it before anything depends on it: `homelab-maint notify-test` (sends one clearly labelled TEST of each kind to your phone and
inbox), then `homelab-maint migrate check notify-route`. backup-notify-hermes.py and backup_report_html.py are libraries of the
umbrella now: NEVER move them (core.Notifier's bridge and notify.py's palette import them).
"""

[[item]]
name = "smartd-alert-hook"
title = "smartd -M exec hook (smart-alert.sh)"
kind = "hook"
location = "/etc/smartd.conf: DEVICESCAN -a -n standby,q -W 4,45,55 -m root -M exec /usr/local/sbin/smart-alert.sh"
mode = "port"
wave = 2
schedule = "event driven (smartd)"
replaced_by = "smart_event"
via = "task"
depends_on = ["notify-route"]
soak_days = 14
parity_check = [
  { kind = "notify", kinds = ["test"], max_age_days = 30 },
  { kind = "task", name = "alert_path_health", green = 8, min_hours = 48 },
  # The new entry (homelab_maint/smart_hook.py: stdlib only, so it survives a bad deploy of any other module), run for real from the installed
  # code but with the sender replaced and the log pointed at /dev/null: it parses a smartd TEST event, builds the notify event and returns 0. Nothing is sent or written. Without it the stub would "succeed" while every event
  # silently fell back to the slow legacy script (the stub falls back whenever `homelab-maint smart-event` fails or does not exist).
  { kind = "command", argv = ["/usr/bin/python3", "-c", "import sys; sys.path.insert(0, '/usr/local/lib/homelab-maint'); from homelab_maint import smart_hook as n; sent = []; n._notify = lambda ev: (sent.append(ev), {'ok': True})[1]; rc = n.smart_event(env={'SMARTD_DEVICE': '/dev/TEST', 'SMARTD_FAILTYPE': 'EmailTest', 'SMARTD_MESSAGE': 'TEST ONLY'}, argv=['x'], log_path='/dev/null'); ok = rc == 0 and len(sent) == 1 and sent[0]['kind'] == 'test'; print('smart_event dry run ok' if ok else 'smart_event dry run FAILED'); sys.exit(0 if ok else 1)"], regex = "^smart_event dry run ok", timeout = 30, note = "`python3 -c ...` runs the new smart_hook entry for real on a smartd TEST event (sender replaced, log at /dev/null: nothing is sent or written) and gets exit 0" },
  # ... and the installed CLI really has the subcommand the stub calls.
  { kind = "command", argv = ["/usr/bin/grep", "-q", "smart-event", "/usr/local/lib/homelab-maint/homelab_maint/cli.py"], note = "the installed cli.py knows the `smart-event` subcommand the stub calls" },
]
retire_actions = [
  { do = "move", src = "/usr/local/sbin/smart-alert.sh" },
  { do = "stub", path = "/usr/local/sbin/smart-alert.sh", mode = "0755", content = """#!/bin/sh
# homelab-maint forwarding stub (the retired smart-alert.sh). smartd.conf still names this path and is NOT edited.
# The umbrella handles the event; if it cannot run, fall back to the legacy script so a SMART alert is never lost.
/usr/local/sbin/homelab-maint smart-event "$@" && exit 0
exec {legacy_dir}/smart-alert.sh "$@"
""" },
]
owner_notes = """
smartd.conf and smartd are not touched (no reload needed): the old path becomes a stub that calls `homelab-maint smart-event`, which logs
to /var/log/smart-alert.log first (alert_path_health reads it) and then goes through notify.send. The swap is atomic: the script is copied
(verified) into the legacy dir and the stub replaces it in ONE rename, so smartd, which calls the hook once and does not retry, never finds
the path empty; rollback is one rename the other way. After cutover test it end to end:
sudo env SMARTD_DEVICE=/dev/TEST SMARTD_FAILTYPE=EmailTest SMARTD_MESSAGE='TEST ONLY' /usr/local/sbin/smart-alert.sh
and expect a line in /var/log/smart-alert.log plus a labelled test email. /etc/smartmontools/run.d/10mail is the unused package default.
"""

