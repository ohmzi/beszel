kind = "unit"
location = "ohmz user manager: hermes-gateway.service, hermes-delivery.timer (1 min), flightclaw.service (127.0.0.1:8765), cancel-service.service (loopback, behind cloudflared); ~/.hermes/cron (one fare-watch job)"
mode = "keep"
