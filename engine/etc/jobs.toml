# --- container-audit: added 2026-10-04 during the /home/ohmz migration ---
# Every container restarted and recreated onto new bind-mount roots. This is the
# standing version of the check run by hand at the end of that migration: state,
# health, restart count and a log error scan, so a container wedged by a path
# move is caught without anyone looking. Read-only; it never restarts anything.
[[job]]
name = "container-audit"
title = "Container health + log error audit"
command = ["/usr/bin/python3", "/usr/local/sbin/container-audit.py", "--quiet"]
user = "root"
schedule = "every 6h"
class = "P1"
monitor = true
quiet = true
timeout_s = 600
source = "native"                # no legacy driver: the tick runs it from the start, so no retire interlock
mode = "managed"
note = "Containers listed in /etc/homelab-maint/container-audit.ignore may be stopped without alerting."
[job.success]
status_json = "/var/lib/homelab-maint/container-audit.json"
result_key = "result"
ok_values = ["ok"]
finished_key = "finished"
[job.notify]
on_failure = "alert"
