# Installed by homelab-maint's install.sh; the original immich-server-recycle.service is not touched.
#
# The recycle timer fires every 2 h and `docker restart immich_server` would interrupt whatever
# Immich job is running. Ask homelab-maint first: the gate exits 0 when Immich is idle (restart),
# 1 when it is busy (the unit is skipped, not failed; the next timer tick tries again), and
# proceeds anyway once it has deferred for max_defer_hours (12 h) so memory growth stays bounded.
# Any gate error also exits non-zero, so a broken probe defers the restart instead of forcing it.
[Service]
ExecCondition=/usr/local/sbin/homelab-maint gate immich-recycle
